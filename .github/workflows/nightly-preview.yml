name: Nightly Preview

# Binary-only Android internal APK for internal testers (dev API).
# Does not use OTA / eas update. Does not require the Expo GitHub App —
# only secrets.EXPO_TOKEN (same pattern as preview-build.yml).

on:
  schedule:
    # APK at 23:17 America/Los_Angeles (off :00 peak). Changing the cron
    # string re-registers GitHub's scheduler — after workflow_dispatch,
    # `0 6 * * *` had drifted to ~17:00–18:00 UTC (~11:00 PT) the next day.
    - cron: '17 23 * * *'
      timezone: America/Los_Angeles
    # Slack after overnight build. Incoming webhooks cannot mute phone
    # push; hold notices until Pacific business hours (success and failure).
    - cron: '7 9 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even when HEAD matches the last successful nightly'
        required: false
        type: boolean
        default: false
      notify_slack:
        description: 'Send Slack notifications'
        required: false
        type: boolean
        default: true
  # Same-repo label trigger so the workflow can be tested from a PR before it
  # exists on main (workflow_dispatch only registers after the file is on default).
  pull_request:
    types: [labeled]

concurrency:
  group: nightly-preview
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

env:
  EAS_PROJECT_ID: 'b0919574-f268-4768-b3bd-7cfa5172bbab'
  EXPECTED_DEV_API_URL: https://dev.api.fluent.bible
  EAS_PROFILE: nightly

jobs:
  nightly-preview:
    name: Nightly Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >
      (github.event_name != 'pull_request' ||
      contains(github.event.label.name, 'nightly-preview'))
      && (github.event_name != 'schedule' ||
      github.event.schedule != '7 9 * * *')
    env:
      # On schedule, inputs are empty → force false, notify true.
      # PR label runs always force a build (test / one-off).
      FORCE_BUILD: ${{ inputs.force_build || github.event_name == 'pull_request' || false }}
      NOTIFY_SLACK: ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.notify_slack }}

    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🏗️ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Resolve trigger metadata
        id: meta
        run: |
          set -euo pipefail
          TRIGGER="${{ github.event_name }}"
          AUTHOR=$(git log -1 --pretty=format:'%an')
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          BASE_VERSION=$(grep -E "^const APP_VERSION_FALLBACK" app.config.ts | sed -E "s/.*'([^']+)'.*/\1/" || true)
          if [ -z "${BASE_VERSION}" ]; then
            BASE_VERSION=$(node -p "require('./package.json').version")
          fi
          {
            echo "trigger=${TRIGGER}"
            echo "author=${AUTHOR}"
            echo "build_date=${BUILD_DATE}"
            echo "base_version=${BASE_VERSION}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"

      - name: Drop drifted schedule fires
        id: window
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node .github/scripts/nightly-windows.cjs | tee -a "${GITHUB_OUTPUT}"
          IN_WINDOW=$(grep '^in_window=' "${GITHUB_OUTPUT}" | tail -n1 | cut -d= -f2)
          HOUR_PT=$(grep '^hour_pt=' "${GITHUB_OUTPUT}" | tail -n1 | cut -d= -f2)
          if [ "${IN_WINDOW}" != "true" ]; then
            echo "::notice::Ignoring drifted schedule fire at ${HOUR_PT}:xx PT (expected ~23:17 America/Los_Angeles)."
          fi

      - name: Write drifted-schedule summary
        if: steps.window.outputs.in_window != 'true'
        run: |
          {
            echo "## Nightly preview — ignored drifted schedule"
            echo ""
            echo "GitHub fired \`schedule\` outside 22:00–02:00 America/Los_Angeles."
            echo "No Slack notification and no EAS build. Cron is \`17 23 * * *\` with \`timezone: America/Los_Angeles\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check for new commits since last success
        id: skip
        if: steps.window.outputs.in_window == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FORCE="${FORCE_BUILD}"
          PREV_SHA=""
          # Latest successful run of this workflow on the default branch (main)
          PREV_SHA=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-preview.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_sha != null)] | .[0].head_sha // empty' \
            2>/dev/null || true)

          echo "prev_sha=${PREV_SHA}" >> "${GITHUB_OUTPUT}"

          SHOULD_SKIP=false
          if [ "${FORCE}" = "true" ]; then
            echo "🔁 force_build=true — will build"
          elif [ -n "${PREV_SHA}" ] && [ "${PREV_SHA}" = "${GITHUB_SHA}" ]; then
            SHOULD_SKIP=true
            echo "⏭️ HEAD ${GITHUB_SHA:0:7} matches last successful nightly — skipping build"
          else
            echo "✅ New commits since last successful nightly (prev=${PREV_SHA:-none})"
          fi
          echo "should_skip=${SHOULD_SKIP}" >> "${GITHUB_OUTPUT}"

      - name: Changelog
        id: changelog
        if: steps.window.outputs.in_window == 'true'
        env:
          PREV_SHA: ${{ steps.skip.outputs.prev_sha }}
        run: bash .github/scripts/nightly-changelog.sh

      - name: Write skip summary
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip == 'true'
        run: |
          {
            echo "## Nightly preview — skipped"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | \`${{ steps.meta.outputs.trigger }}\` |"
            echo "| Branch | \`${{ steps.meta.outputs.branch }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| Author | ${{ steps.meta.outputs.author }} |"
            echo "| Reason | No new commits since last successful nightly |"
            echo ""
            echo "Re-run with **force_build** to build anyway."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write Slack payload (skipped)
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip == 'true'
        env:
          SLACK_PAYLOAD_OUT: ${{ runner.temp }}/slack-payload.json
          SLACK_PENDING: ${{ steps.window.outputs.in_slack_hours != 'true' }}
          STATUS: skipped
          TRIGGER: ${{ steps.meta.outputs.trigger }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHA: ${{ steps.meta.outputs.sha }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
        run: bash .github/scripts/write-slack-nightly-payload.sh

      - name: Notify Slack (skipped)
        if: >
          steps.window.outputs.in_window == 'true' &&
          steps.skip.outputs.should_skip == 'true' &&
          steps.window.outputs.in_slack_hours == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_PAYLOAD_JSON: ${{ runner.temp }}/slack-payload.json
        run: bash .github/scripts/notify-slack-nightly.sh

      - name: 📦 Install dependencies
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        run: npm ci

      - name: Validate nightly API URL
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        id: api-url
        run: bash .github/scripts/validate-nightly-api-url.sh

      - name: Format check
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        run: npm run format:check

      - name: Lint
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:9999
        run: npm test -- --ci

      - name: Expo doctor
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:9999
        run: npm run doctor

      - name: 🏗️ Setup EAS
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 EAS nightly Android build (binary only)
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        id: build
        env:
          PROFILE: ${{ env.EAS_PROFILE }}
          MESSAGE: Nightly ${{ steps.meta.outputs.base_version }} ${{ steps.meta.outputs.short_sha }} (${{ steps.meta.outputs.trigger }})
        run: bash .github/scripts/eas-build-android-nightly.sh

      - name: Job summary (success)
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true' && steps.build.outputs.build_id != ''
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          {
            echo "## Nightly preview — success"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Platform | Android |"
            echo "| Environment | development API (\`${{ steps.api-url.outputs.api_base_url }}\`) |"
            echo "| EAS profile | \`${{ env.EAS_PROFILE }}\` |"
            echo "| Expo Updates | disabled (binary only — no OTA) |"
            echo "| Trigger | \`${{ steps.meta.outputs.trigger }}\` |"
            echo "| Branch | \`${{ steps.meta.outputs.branch }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.sha }}\` |"
            echo "| Author | ${{ steps.meta.outputs.author }} |"
            echo "| Build date | ${{ steps.meta.outputs.build_date }} |"
            echo "| App version | ${{ steps.build.outputs.app_version || steps.meta.outputs.base_version }} |"
            echo "| Native build number | ${{ steps.build.outputs.version_code || 'n/a' }} |"
            echo "| Build id | \`${{ steps.build.outputs.build_id }}\` |"
            echo "| Install | ${{ steps.build.outputs.install_url }} |"
            echo ""
            echo "### Changelog"
            echo ""
            echo "${CHANGELOG}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write Slack payload (success)
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true' && steps.build.outputs.build_id != ''
        env:
          SLACK_PAYLOAD_OUT: ${{ runner.temp }}/slack-payload.json
          SLACK_PENDING: ${{ steps.window.outputs.in_slack_hours != 'true' }}
          STATUS: success
          TRIGGER: ${{ steps.meta.outputs.trigger }}
          PLATFORM: android
          PROFILE: ${{ env.EAS_PROFILE }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHA: ${{ steps.meta.outputs.sha }}
          AUTHOR: ${{ steps.meta.outputs.author }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          APP_VERSION: ${{ steps.build.outputs.app_version || steps.meta.outputs.base_version }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          INSTALL_URL: ${{ steps.build.outputs.install_url }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          API_BASE_URL: ${{ steps.api-url.outputs.api_base_url }}
          FEEDBACK_URL: https://github.com/${{ github.repository }}/issues/new
        run: bash .github/scripts/write-slack-nightly-payload.sh

      - name: Notify Slack (success)
        if: >
          steps.window.outputs.in_window == 'true' &&
          steps.skip.outputs.should_skip != 'true' &&
          steps.build.outputs.build_id != '' &&
          steps.window.outputs.in_slack_hours == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_PAYLOAD_JSON: ${{ runner.temp }}/slack-payload.json
        run: bash .github/scripts/notify-slack-nightly.sh

      - name: Comment nightly install on recent QA handoff issues
        if: steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true' && steps.build.outputs.build_id != '' && steps.build.outputs.install_url != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INSTALL_URL: ${{ steps.build.outputs.install_url }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          APP_VERSION: ${{ steps.build.outputs.app_version || steps.meta.outputs.base_version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PREV_SHA: ${{ steps.skip.outputs.prev_sha }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
        with:
          script: |
            const nightlyNotifyQaIssues = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/nightly-notify-qa-issues.cjs`);
            await nightlyNotifyQaIssues({
              github,
              context,
              core,
              installUrl: process.env.INSTALL_URL,
              buildId: process.env.BUILD_ID || null,
              appVersion: process.env.APP_VERSION || null,
              shortSha: process.env.SHORT_SHA || null,
              prevSha: process.env.PREV_SHA || null,
              runUrl: process.env.RUN_URL || null,
            });

      - name: Write Slack payload (failure)
        if: failure() && steps.window.outputs.in_window == 'true' && steps.skip.outputs.should_skip != 'true'
        env:
          SLACK_PAYLOAD_OUT: ${{ runner.temp }}/slack-payload.json
          SLACK_PENDING: ${{ steps.window.outputs.in_slack_hours != 'true' }}
          STATUS: failure
          TRIGGER: ${{ steps.meta.outputs.trigger }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHA: ${{ steps.meta.outputs.sha }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          FAILED_STEP: ${{ github.job }}
        run: bash .github/scripts/write-slack-nightly-payload.sh

      # Same :zzz: skip-style card as “no new commits” — not a red incident ping.
      - name: Notify Slack (failure)
        if: >
          failure() &&
          steps.window.outputs.in_window == 'true' &&
          steps.skip.outputs.should_skip != 'true' &&
          steps.window.outputs.in_slack_hours == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_PAYLOAD_JSON: ${{ runner.temp }}/slack-payload.json
        run: bash .github/scripts/notify-slack-nightly.sh

      - name: Upload pending Slack payload
        if: >
          always() &&
          env.NOTIFY_SLACK == 'true' &&
          steps.window.outputs.in_window == 'true' &&
          steps.window.outputs.in_slack_hours != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-slack-payload
          path: ${{ runner.temp }}/slack-payload.json
          if-no-files-found: ignore
          retention-days: 2

  nightly-slack:
    name: Slack in Pacific business hours
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deliver pending Slack if this is the morning slot
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          HOUR_PT=$(TZ=America/Los_Angeles date +%H)
          echo "hour_pt=${HOUR_PT} cron=${SCHEDULE_CRON}"
          case "${SCHEDULE_CRON}" in
            '7 9 * * *') ;;
            *)
              case "${HOUR_PT}" in
                09|10) ;;
                *)
                  echo "Not the 09:07 America/Los_Angeles Slack slot — exiting"
                  exit 0
                  ;;
              esac
              ;;
          esac
          bash .github/scripts/deliver-pending-slack-nightly.sh
