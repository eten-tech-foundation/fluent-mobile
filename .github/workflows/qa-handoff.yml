name: QA Handoff

# Post-merge: Needs QA? Yes → comment + assign Roslin22 + Project 4 In QA.
# Merge is not blocked on QA; testers use the next nightly APK.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  qa-handoff:
    name: Post-merge QA handoff
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot-preview[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Handoff linked tickets to QA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_BOARD_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
        with:
          script: |
            const qaHandoffOnMerge = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/qa-handoff-on-merge.cjs`);
            await qaHandoffOnMerge({ github, context, core, getOctokit });
