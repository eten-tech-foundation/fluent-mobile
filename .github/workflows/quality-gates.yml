name: Quality Gates

# TypeScript + Expo health checks for PRs. PR CI is a frozen snapshot of this
# commit (pinned Node via .nvmrc; lockfile expo-doctor — never @latest).
# `expo install --check` still consults Expo's published SDK matrix and can
# go red overnight; that is recovered by the weekday Expo sync job (#422),
# not by drive-by lockfile commits on feature branches. No native Gradle build —
# native compile is on-demand via EAS preview (preview-build label) and nightly APK;
# post-merge QA uses nightly (see docs/guides/qa-process.md). Production: tag → EAS.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  expo-doctor:
    name: expo-doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_API_BASE_URL: http://localhost:9999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run expo-doctor
        run: npm run doctor

  expo-install-check:
    name: expo install --check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_API_BASE_URL: http://localhost:9999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency versions
        run: npx expo install --check

  docs-structure:
    name: Docs Structure Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: ./scripts/check-docs-structure.sh
