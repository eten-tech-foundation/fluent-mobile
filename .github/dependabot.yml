version: 2
# Process: docs/guides/dependabot-process.md (one-at-a-time checklist + doctor)
updates:
  # npm dependencies (package-lock.json)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    ignore:
      # Hold React Native to the 0.86.x line — upgrade in a dedicated ticket
      - dependency-name: 'react-native'
        versions:
          - '>=0.87.0'
      - dependency-name: 'react-native-*'
        versions:
          - '>=0.87.0'
      - dependency-name: '@react-native/*'
        versions:
          - '>=0.87.0'
      # React must stay lock-step with RN 0.86 (pinned in package.json)
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'react-test-renderer'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Native SQLite — validate binary compatibility before bumping
      - dependency-name: '@op-engineering/op-sqlite'
        update-types:
          - 'version-update:semver-major'
    reviewers:
      - 'eten-tech-foundation/fluent-admin'
    labels:
      - 'dependencies'
      - 'automated'
    versioning-strategy: increase
    groups:
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-community/*'
      react:
        patterns:
          - 'react'
          - 'react-*'
          - '@types/react'
          - '@types/react-test-renderer'
      navigation:
        patterns:
          - '@react-navigation/*'
      testing:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@jest/*'
          - '@testing-library/*'
      dev-tools:
        patterns:
          - 'typescript'
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'prettier'
          - '@babel/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - 'babel-preset-expo'
          - 'jest-expo'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      # Batch all github-actions SHA bumps into a single weekly PR.
      # Wildcard, not an enumerated vendor list — must cover expo/*.
      github-actions:
        patterns:
          - '*'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - 'github_actions'
      - 'dependencies'
      - 'automated'
