# Reach Home tabs from Sync / Settings / Prepare Offline / drafting.
appId: com.eten.fluent
tags:
  - ordered-readonly
---
- runFlow: ../ensure/ensure-no-modal.yaml
- runFlow:
    when:
      visible:
        id: 'sync-screen'
    commands:
      - back
- runFlow:
    when:
      visible:
        id: 'drafting-tab-bar'
    commands:
      - back
- runFlow:
    when:
      visible:
        id: 'settings-prepare-offline'
    commands:
      - back
# prepare-offline-screen: do NOT use system `back` here — ensure-no-modal
# (above and below) already dismisses it with stack-header-back only, because
# system Back can overshoot to the Android launcher. No redundant PFO branch.
- runFlow: ../ensure/ensure-no-modal.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 30000
