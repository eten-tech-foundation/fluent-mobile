# Open the first Next-up passage (or first book cover). Requires ≥1 assignment
# or book (Account A). Post-login sync may auto-push Prepare-for-Offline —
# dismiss and re-tap until Passage or Observer mounts.
appId: com.eten.fluent
---
- runFlow: goto-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-next-up-hero|home-next-.*|home-book-.*'
    timeout: 60000
- runFlow: ../ensure/ensure-no-modal.yaml
- runFlow:
    when:
      visible:
        id: 'home-next-.*'
    commands:
      - tapOn:
          id: 'home-next-.*'
- runFlow:
    when:
      notVisible:
        id: 'passage-header|observer-screen|book-header'
    commands:
      - tapOn:
          id: 'home-book-.*'
- repeat:
    times: 8
    while:
      notVisible:
        id: 'passage-header|observer-screen'
    commands:
      - runFlow: ../ensure/ensure-no-modal.yaml
      - runFlow:
          when:
            visible:
              id: 'book-passage-.*'
          commands:
            - tapOn:
                id: 'book-passage-.*'
      - runFlow:
          when:
            visible:
              id: 'home-next-.*'
          commands:
            - tapOn:
                id: 'home-next-.*'
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: 'passage-header|observer-screen'
    timeout: 60000
