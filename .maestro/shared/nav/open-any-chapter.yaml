# Open first My Work chapter into drafting. Requires ≥1 assignment (Account A).
# Use my-work-row-\d+$ so we do not match my-work-row-title-* (non-pressable Text).
# Pre-tap ensure-no-modal dismisses Prepare-for-Offline. Do not while-notVisible
# drafting-tab-bar: that exit check waits 7s even when the bar is already up.
# extendedWaitUntil is the positive readiness gate.
appId: com.eten.fluent
---
- runFlow: goto-home.yaml
- tapOn:
    id: 'home-tab-my-work'
- extendedWaitUntil:
    visible:
      id: 'my-work-row-\d+$'
    timeout: 30000
- runFlow: ../ensure/ensure-no-modal.yaml
- tapOn:
    id: 'my-work-row-\d+$'
- extendedWaitUntil:
    visible:
      id: 'drafting-tab-bar'
    timeout: 30000
