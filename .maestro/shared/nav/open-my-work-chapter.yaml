# Open the fixture chapter by id into Next Passage. Requires
# MAESTRO_FIXTURE_CHAPTER_ID. Missing id is a failed precondition (runner
# preflight reports BLOCKED).
# Prefer Next up (`home-next-{id}:…`); else Changes requested. The tiles
# after the hero sit in a horizontal rail, so a vertical search can miss
# one that is already in Next up. There is no Book-page fallback here — a
# chapter outside those rails times out (Blocked).
# Callers that pin a different chapter (resources empty/populated) must pass
# `env: MAESTRO_FIXTURE_CHAPTER_ID` on `runFlow`; this helper copies env onto
# output and would overwrite a caller-set output.fixtureChapterId.
# YAML ${MAESTRO_FIXTURE_CHAPTER_ID} is the literal "undefined" when the key
# is missing on Maestro 2.10.0.
appId: com.eten.fluent
tags:
  - ordered-readonly
---
- evalScript: >-
    ${output.fixtureChapterId = (typeof MAESTRO_FIXTURE_CHAPTER_ID === 'undefined' || MAESTRO_FIXTURE_CHAPTER_ID === null) ? '' : String(MAESTRO_FIXTURE_CHAPTER_ID).trim()}
- assertTrue: ${typeof output.fixtureChapterId === 'string' && /^[1-9][0-9]*$/.test(output.fixtureChapterId)}
- runFlow: goto-home.yaml
- runFlow: ../ensure/ensure-no-modal.yaml
- runFlow:
    when:
      visible:
        id: '^home-next-${output.fixtureChapterId}:.*'
    commands:
      - tapOn:
          id: '^home-next-${output.fixtureChapterId}:.*'
- runFlow:
    when:
      notVisible:
        id: 'passage-header|observer-screen'
    commands:
      - runFlow:
          when:
            visible:
              id: '^home-changes-requested-${output.fixtureChapterId}$'
          commands:
            - tapOn:
                id: '^home-changes-requested-${output.fixtureChapterId}$'
- runFlow:
    when:
      notVisible:
        id: 'passage-header|observer-screen'
    commands:
      # Bring the section on screen, then the horizontal rail if the tile
      # is past the hero and outside the viewport.
      - scrollUntilVisible:
          element:
            id: 'home-next-up'
          direction: DOWN
          timeout: 30000
          visibilityPercentage: 50
      - runFlow:
          when:
            notVisible:
              id: '^home-next-${output.fixtureChapterId}:.*'
          commands:
            - scrollUntilVisible:
                element:
                  id: '^home-next-${output.fixtureChapterId}:.*'
                direction: RIGHT
                timeout: 30000
                visibilityPercentage: 50
      - runFlow: ../ensure/ensure-no-modal.yaml
      - tapOn:
          id: '^home-next-${output.fixtureChapterId}:.*'
- extendedWaitUntil:
    visible:
      id: 'passage-header|observer-screen'
    timeout: 30000
