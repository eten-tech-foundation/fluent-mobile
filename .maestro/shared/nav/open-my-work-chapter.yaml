# Open the fixture chapter by id. Requires MAESTRO_FIXTURE_CHAPTER_ID.
# Missing id is a failed precondition (runner preflight reports BLOCKED).
# Anchored ids: chapter 12 must not match my-work-row-123 or my-work-row-title-12.
appId: com.eten.fluent
tags:
  - ordered-readonly
---
- assertTrue: ${typeof MAESTRO_FIXTURE_CHAPTER_ID !== 'undefined' && /^[1-9][0-9]*$/.test(String(MAESTRO_FIXTURE_CHAPTER_ID))}
- runFlow: goto-home.yaml
- tapOn:
    id: 'home-tab-my-work'
- extendedWaitUntil:
    visible:
      id: '^my-work-row-${MAESTRO_FIXTURE_CHAPTER_ID}$'
    timeout: 30000
- runFlow: ../ensure/ensure-no-modal.yaml
- tapOn:
    id: '^my-work-row-${MAESTRO_FIXTURE_CHAPTER_ID}$'
- extendedWaitUntil:
    visible:
      id: 'drafting-tab-bar'
    timeout: 30000
