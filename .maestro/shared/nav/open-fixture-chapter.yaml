# Open Home → fixture project/book → chapter label → Next Passage.
# Env: MAESTRO_FIXTURE_PROJECT_NAME, MAESTRO_FIXTURE_CHAPTER_LABEL
appId: com.eten.fluent
---
- runFlow: goto-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-books'
    timeout: 60000
- runFlow: ../ensure/ensure-no-modal.yaml
- scrollUntilVisible:
    element:
      text: ${MAESTRO_FIXTURE_PROJECT_NAME}
    direction: DOWN
    timeout: 60000
- tapOn:
    text: ${MAESTRO_FIXTURE_PROJECT_NAME}
- extendedWaitUntil:
    visible:
      id: 'book-header'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ${MAESTRO_FIXTURE_CHAPTER_LABEL}
    direction: DOWN
    timeout: 90000
- tapOn:
    id: 'book-passage-.*'
- repeat:
    times: 8
    while:
      notVisible:
        id: 'passage-header|observer-screen'
    commands:
      - runFlow: ../ensure/ensure-no-modal.yaml
      - runFlow:
          when:
            visible:
              id: 'book-passage-.*'
          commands:
            - tapOn:
                id: 'book-passage-.*'
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: 'passage-header|observer-screen'
    timeout: 60000
