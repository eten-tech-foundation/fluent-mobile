# Home → Sync screen via header sync button.
# Local Debug+Metro: Expo Dev Menu can steal the sync tap — dismiss and retry.
# Maestro 2.10 can report the tap COMPLETED mid-activeOpacity while sync-screen
# never mounts (#721): settle first and press the element centre via `point`
# (element-relative, not device pixels). The retry loop stays as the fallback.
appId: com.eten.fluent
tags:
  - ordered-readonly
---
- runFlow: goto-home.yaml
- runFlow: ../../helpers/dismiss-expo-dev-menu.yaml
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 4
    while:
      notVisible:
        id: 'sync-screen'
    commands:
      - runFlow: ../../helpers/dismiss-expo-dev-menu.yaml
      - runFlow:
          when:
            visible:
              id: 'home-sync-button'
          commands:
            - tapOn:
                id: 'home-sync-button'
                point: '50%,50%'
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: 'sync-screen'
    timeout: 30000
