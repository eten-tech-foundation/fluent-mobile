# Home → accounts sheet → Settings.
appId: com.eten.fluent
---
- runFlow: goto-home.yaml
- tapOn:
    id: 'home-account'
- extendedWaitUntil:
    visible:
      id: 'home-accounts'
    timeout: 15000
- tapOn:
    id: 'home-accounts-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-prepare-offline'
    timeout: 30000
