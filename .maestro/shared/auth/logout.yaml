# Accounts sheet → Log out → login screen. Confirms unsynced-work alert when shown.
appId: com.eten.fluent
---
- tapOn:
    id: 'home-account'
- extendedWaitUntil:
    visible:
      id: 'home-accounts'
    timeout: 15000
- tapOn:
    id: 'home-accounts-log-out'
- runFlow:
    when:
      visible: 'Unsynced work on device'
    commands:
      - tapOn: 'Log out'
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 60000
