# Fail fast on Legacy when Record is absent (at cap). Next capacity is
# asserted in the recording flows (`passage-key-record` enabled) — a visible
# `passage-record` here is not a capacity signal (blocked Record still shows).
appId: com.eten.fluent
---
- runFlow:
    when:
      notVisible:
        id: 'passage-record'
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'record-start-button'
              enabled: true
          commands:
            - assertVisible:
                id: 'record-new-take-button'
                enabled: true
