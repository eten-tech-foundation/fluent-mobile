# Fail fast when neither Next Record nor an enabled Legacy start/new-take is
# available (at cap). Next capacity is asserted in the recording flows; this
# helper only refuses a dead Record control.
appId: com.eten.fluent
---
- runFlow:
    when:
      visible:
        id: 'passage-record'
    commands:
      - assertVisible:
          id: 'passage-record'
- runFlow:
    when:
      notVisible:
        id: 'passage-record'
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'record-start-button'
              enabled: true
          commands:
            - assertVisible:
                id: 'record-new-take-button'
                enabled: true
