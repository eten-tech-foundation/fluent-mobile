# Dismiss auto Prepare-for-Offline push and drawer if present.
# Repeat — sync can re-push Prepare-for-Offline after the first dismiss.
appId: com.eten.fluent
---
- repeat:
    times: 4
    while:
      visible:
        id: 'prepare-offline-screen'
    commands:
      - tapOn:
          id: 'stack-header-back'
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible:
        id: 'settings-drawer-content'
    commands:
      - pressKey: Back
