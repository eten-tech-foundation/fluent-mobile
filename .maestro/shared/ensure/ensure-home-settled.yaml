# After auth: dismiss Prepare-for-Offline until Next Home is visible.
# Home can auto-push Prepare-for-Offline after login; waiting for
# home-header alone fails while that screen covers it.
appId: com.eten.fluent
---
- repeat:
    times: 6
    while:
      notVisible:
        id: 'home-header'
    commands:
      - runFlow: ensure-no-modal.yaml
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow: ensure-no-modal.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: 'home-loading'
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: 'home-chapters-loading'
    timeout: 120000
- assertVisible:
    id: 'home-header'
- assertVisible:
    id: 'home-scroll'
