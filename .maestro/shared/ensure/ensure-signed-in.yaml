# Reach Home signed in as Account A. Logs in if login is visible.
appId: com.eten.fluent
---
- runFlow: ensure-no-modal.yaml
- runFlow:
    when:
      visible:
        id: 'login-email-input'
    commands:
      - runFlow: ../auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- runFlow: ensure-at-home.yaml
