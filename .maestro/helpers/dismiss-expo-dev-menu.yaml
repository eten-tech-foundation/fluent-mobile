# Prefer EXPO_PUBLIC_E2E_MODE=1 on Debug+Metro so the Dev Menu never opens.
# Only dismiss when Dev Menu chrome is visible. Never pressKey Back — that
# leaves the app and lands on the Android launcher (breaks ensure-on-login).
appId: com.eten.fluent
tags:
  - ordered-readonly
---
# Opt-in strict mode (MAESTRO_EXPECT_EXPO_DEV_MENU_ABSENT=1): fail instead of
# dismissing when Dev Menu chrome is showing. The probes below always run.
- runFlow:
    when:
      true: "${(typeof MAESTRO_EXPECT_EXPO_DEV_MENU_ABSENT === 'undefined' ? '' : String(MAESTRO_EXPECT_EXPO_DEV_MENU_ABSENT)) === '1'}"
    commands:
      - assertNotVisible: 'Toggle performance monitor'
      - assertNotVisible: 'Reload'
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - tapOn:
          text: 'Close'
- runFlow:
    when:
      visible: 'Reload'
    commands:
      - tapOn:
          text: 'Close'
          optional: true
