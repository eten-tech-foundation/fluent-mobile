# Prefer EXPO_PUBLIC_E2E_MODE=1 on Debug+Metro so the Dev Menu never opens.
# That mode matches src/config/e2eMode.ts (1 or true). Skip the visible probes
# then — a miss waits Maestro's fixed 7s optional lookup. When E2E mode is off,
# still dismiss only if Dev Menu chrome is visible. Never pressKey Back — that
# leaves the app and lands on the Android launcher (breaks ensure-on-login).
appId: com.eten.fluent
---
# Existing-session runs can explicitly require the Dev Menu to be absent.
# These strict negative assertions fail if either menu marker appears; they do
# not assume the app was launched in E2E mode or dismiss an unexpected modal.
# They avoid the fixed missing-element lookup of optional when.visible probes.
- runFlow:
    when:
      true: "${(typeof MAESTRO_EXPECT_EXPO_DEV_MENU_ABSENT === 'undefined' ? '' : String(MAESTRO_EXPECT_EXPO_DEV_MENU_ABSENT)) === '1'}"
    commands:
      - assertNotVisible: 'Toggle performance monitor'
      - assertNotVisible: 'Reload'
- runFlow:
    when:
      true: "${(typeof MAESTRO_EXPECT_EXPO_DEV_MENU_ABSENT === 'undefined' ? '' : String(MAESTRO_EXPECT_EXPO_DEV_MENU_ABSENT)) !== '1' && (typeof EXPO_PUBLIC_E2E_MODE === 'undefined' ? '' : String(EXPO_PUBLIC_E2E_MODE)).toLowerCase() != '1' && (typeof EXPO_PUBLIC_E2E_MODE === 'undefined' ? '' : String(EXPO_PUBLIC_E2E_MODE)).toLowerCase() != 'true'}"
    commands:
      - runFlow:
          when:
            visible: 'Toggle performance monitor'
          commands:
            - tapOn:
                text: 'Close'
      - runFlow:
          when:
            visible: 'Reload'
          commands:
            - tapOn:
                text: 'Close'
                optional: true
