# Prefer EXPO_PUBLIC_E2E_MODE=1 on Debug+Metro so the Dev Menu never opens.
# Only dismiss when Dev Menu chrome is visible. Never pressKey Back — that
# leaves the app and lands on the Android launcher (breaks ensure-on-login).
appId: com.eten.fluent
---
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - tapOn:
          text: 'Close'
- runFlow:
    when:
      visible: 'Reload'
    commands:
      - tapOn:
          text: 'Close'
          optional: true
