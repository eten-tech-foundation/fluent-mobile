# After launch (cold or warm): reach app JS.
# One wait matches any shell. Do not serially time out on login, then loading,
# then Home — a restored session would pay the login timeout every time.
# Metro recovery runs only when MAESTRO_LAUNCH_MODE=metro.
# E2E mode (1 or true) skips the Error-loading and Connect text probes: a miss
# waits Maestro's fixed 7s lookup. Non-E2E metro still runs them.
appId: com.eten.fluent
---
- runFlow:
    when:
      true: ${MAESTRO_LAUNCH_MODE == 'metro'}
    commands:
      - runFlow:
          when:
            true: "${(typeof EXPO_PUBLIC_E2E_MODE === 'undefined' ? '' : String(EXPO_PUBLIC_E2E_MODE)).toLowerCase() != '1' && (typeof EXPO_PUBLIC_E2E_MODE === 'undefined' ? '' : String(EXPO_PUBLIC_E2E_MODE)).toLowerCase() != 'true'}"
          commands:
            - runFlow:
                when:
                  visible: 'Error loading app'
                commands:
                  - tapOn:
                      text: 'Close'
                      optional: true
                  - pressKey: Back
                  - openLink: ${MAESTRO_DEV_CLIENT_URL}
                  - waitForAnimationToEnd:
                      timeout: 15000
            - runFlow:
                when:
                  visible: 'Connect'
                commands:
                  - openLink: ${MAESTRO_DEV_CLIENT_URL}
                  - waitForAnimationToEnd:
                      timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'login-email-input|home-tab-my-work|auth-session-error|prepare-offline-screen'
    timeout: 45000
- runFlow: dismiss-expo-dev-menu.yaml
