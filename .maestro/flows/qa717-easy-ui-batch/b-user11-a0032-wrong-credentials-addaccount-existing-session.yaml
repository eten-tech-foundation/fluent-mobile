# A-0032-01: one synthetic wrong-credentials submit on Add Account Login.
# Existing session user11 on emulator-5556; Cancel/Back restores Home11.
# No clearState / ensure-on-login / logout. Never touches A5554/user12.
appId: com.eten.fluent
tags: [accounts, existing-session, a0032, negative-auth]
---
- assertTrue: ${typeof MAESTRO_B_USER_ID !== 'undefined' && MAESTRO_B_USER_ID === '11' && typeof MAESTRO_B_SERIAL !== 'undefined' && MAESTRO_B_SERIAL === 'emulator-5556'}
- runScript: ../../shared/scripts/a0032-synthetic-negative-values.js
- assertTrue: ${output.a0032EmailDomainOk === true}
- tapOn:
    id: '^home-settings-button$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^settings-menu-active-11$'
    timeout: 15000
- assertVisible:
    id: '^settings-menu-account-11$'
- assertNotVisible:
    id: '^settings-menu-account-(?!11$)[0-9]+$'
- assertVisible:
    id: '^settings-menu-add-user$'
    enabled: true
- tapOn:
    id: '^settings-menu-add-user$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^login-email-input$'
    timeout: 15000
- tapOn:
    id: '^login-email-input$'
- eraseText
- inputText: ${output.a0032Email}
- tapOn:
    id: '^login-password-input$'
- eraseText
- inputText: ${output.a0032InvalidPassword}
- hideKeyboard
- tapOn:
    id: '^login-submit-button$'
- extendedWaitUntil:
    visible:
      id: '^login-global-error$'
    timeout: 60000
- assertNotVisible: 'Unable to connect. Please check your internet connection and try again.'
- assertNotVisible: 'Please enter a valid email address'
- assertVisible:
    id: '^login-email-input$'
- assertVisible:
    id: '^login-submit-button$'
- assertNotVisible:
    id: '^home-tab-projects$'
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: '^home-tab-projects$'
    timeout: 15000
- tapOn:
    id: '^home-settings-button$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^settings-menu-active-11$'
    timeout: 15000
- assertVisible:
    id: '^settings-menu-account-11$'
- assertNotVisible:
    id: '^settings-menu-account-(?!11$)[0-9]+$'
- assertVisible:
    id: '^settings-menu-add-user$'
    enabled: true
- assertNotVisible:
    id: '^login-email-input$'
- assertNotVisible: 'Session expired'
- tapOn:
    id: '^settings-menu-account-11$'
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: '^home-tab-projects$'
