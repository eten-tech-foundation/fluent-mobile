# Conflict on the Next book page + Passage notice (#607 / #574).
# Next map: chapter-conflict-indicator → book-chapter meta "Sync conflict";
# record-conflict-warning → passage-notices-conflict.
appId: com.eten.fluent
tags:
  - ownership
  - ownership-conflict
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow:
    file: ../../shared/nav/open-fixture-chapter.yaml
    env:
      MAESTRO_FIXTURE_CHAPTER_LABEL: ${MAESTRO_FIXTURE_CONFLICT_LABEL}
- back
- extendedWaitUntil:
    visible:
      id: 'book-header'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${MAESTRO_FIXTURE_CONFLICT_LABEL}
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
- assertVisible:
    text: ${MAESTRO_FIXTURE_CONFLICT_LABEL}
- assertVisible:
    id: 'book-chapter-[0-9]+-meta'
    text: '.*Sync conflict.*'
    childOf:
      id: 'book-chapter-[0-9]+'
      containsDescendants:
        - text: ${MAESTRO_FIXTURE_CONFLICT_LABEL}
- tapOn:
    id: 'book-passage-[0-9]+-.*'
    childOf:
      id: 'book-chapter-[0-9]+'
      containsDescendants:
        - text: ${MAESTRO_FIXTURE_CONFLICT_LABEL}
- extendedWaitUntil:
    visible:
      id: 'passage-header'
    timeout: 60000
- assertVisible:
    id: 'passage-notices-conflict'
