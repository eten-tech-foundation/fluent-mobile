# Open Peer Check (no peerChecker): no taken notice on Passage (#607 / #574).
appId: com.eten.fluent
tags:
  - ownership
  - ownership-peer-check
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow:
    file: ../../shared/nav/open-fixture-chapter.yaml
    env:
      MAESTRO_FIXTURE_CHAPTER_LABEL: ${MAESTRO_FIXTURE_OPEN_PEER_CHECK_LABEL}
      MAESTRO_FIXTURE_OPEN_CHAPTER_ID: ${MAESTRO_FIXTURE_OPEN_PEER_CHECK_CHAPTER_ID}
- assertVisible:
    id: 'passage-header'
- assertVisible:
    id: 'passage-record|passage-listen|observer-screen'
- assertNotVisible:
    id: 'passage-notices-taken'
