# READ-ONLY: Next book-page ownership / conflict status for one EXISTING
# fixture chapter.
#
# Asserts book-chapter meta beyond entry smoke: env-declared expected
# ownership on a named project+chapter, without claim / record /
# stage-advance / reassign / Sync Now.
#
# Required env (fail if absent/invalid — no skip/auth fallback):
# - MAESTRO_FIXTURE_PROJECT_NAME
# - MAESTRO_FIXTURE_CHAPTER_LABEL
# - MAESTRO_EXPECT_OWNERSHIP = mine | other | unassigned | conflict
#
# Optional env (omit/empty → none; typo FAILS — never silent skip):
# - MAESTRO_EXPECT_RECORD_WARNING = none | taken | conflict
#   When taken|conflict: open Passage read-only to assert notice chrome,
#   then back out. Never taps passage-record / passage-key-record.
#
# Next map: home-tab-projects / milestone-row / chapter-row → home books +
# book-chapter-*-meta ("Yours" / "Someone else's" / "Unassigned" /
# "Sync conflict"); record-*-warning → passage-notices-taken|conflict.
# Leave via book-back (goto-home).
#
# Forbidden: clearState, ensure-on-login, login-*, ensure-warm-home,
# ensure-warm-session, ownership-auto-claim, Sync, Discard recovery.
appId: com.eten.fluent
tags:
  - ownership
  - existing-session
  - read-only
---
- runScript: ../../shared/scripts/ownership-status-values.js
- evalScript: >-
    ${output.projectNameOnHome = (typeof MAESTRO_FIXTURE_PROJECT_NAME === 'undefined' || MAESTRO_FIXTURE_PROJECT_NAME === null) ? '' : String(MAESTRO_FIXTURE_PROJECT_NAME)}
- assertTrue: ${output.fixtureProjectName.length > 0}
- assertTrue: ${output.fixtureChapterLabel.length > 0}
- assertTrue: ${['mine','other','unassigned','conflict'].indexOf(output.expectOwnership) >= 0}
- assertTrue: ${['none','taken','conflict'].indexOf(output.expectRecordWarning) >= 0}
- assertTrue: ${typeof output.projectNameOnHome === 'string' && output.projectNameOnHome.length > 0}
- assertTrue: ${typeof output.chapterLabelRe === 'string' && output.chapterLabelRe.length > 0}

- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/goto-home.yaml
- assertVisible:
    id: 'home-header'
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- scrollUntilVisible:
    element:
      text: '.+${output.projectNameOnHome}.+'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- tapOn:
    text: '.+${output.projectNameOnHome}.+'
- runFlow:
    when:
      visible:
        id: 'passage-header'
    commands:
      - tapOn:
          id: 'passage-title'
      - extendedWaitUntil:
          visible:
            id: 'passage-title-sheet'
          timeout: 15000
      - tapOn:
          id: 'passage-book'
- extendedWaitUntil:
    visible:
      id: 'book-header'
    timeout: 60000
- repeat:
    times: 12
    commands:
      - swipe:
          from:
            id: 'book-list'
          direction: DOWN
          duration: 250
- scrollUntilVisible:
    element:
      text: ${output.chapterLabelRe}
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
- assertVisible:
    id: 'book-chapter-.*'
    containsDescendants:
      - text: ${output.chapterLabelRe}

- runFlow:
    when:
      true: ${output.expectOwnership == 'mine'}
    commands:
      - assertVisible:
          id: 'book-chapter-[0-9]+-meta'
          text: '(.* · )?Yours( · .*)?'
          childOf:
            id: 'book-chapter-[0-9]+'
            containsDescendants:
              - text: ${output.chapterLabelRe}
- runFlow:
    when:
      true: ${output.expectOwnership == 'other'}
    commands:
      - assertVisible:
          id: 'book-chapter-[0-9]+-meta'
          text: "(.* · )?Someone else's( · .*)?"
          childOf:
            id: 'book-chapter-[0-9]+'
            containsDescendants:
              - text: ${output.chapterLabelRe}
- runFlow:
    when:
      true: ${output.expectOwnership == 'unassigned'}
    commands:
      - assertVisible:
          id: 'book-chapter-[0-9]+-meta'
          text: '(.* · )?Unassigned( · .*)?'
          childOf:
            id: 'book-chapter-[0-9]+'
            containsDescendants:
              - text: ${output.chapterLabelRe}
- runFlow:
    when:
      true: ${output.expectOwnership == 'conflict'}
    commands:
      - assertVisible:
          id: 'book-chapter-[0-9]+-meta'
          text: '.*Sync conflict.*'
          childOf:
            id: 'book-chapter-[0-9]+'
            containsDescendants:
              - text: ${output.chapterLabelRe}

- runFlow:
    when:
      true: ${output.expectRecordWarning == 'taken' || output.expectRecordWarning == 'conflict'}
    commands:
      - tapOn:
          id: 'book-passage-[0-9]+-.*'
          childOf:
            id: 'book-chapter-[0-9]+'
            containsDescendants:
              - text: ${output.chapterLabelRe}
      - extendedWaitUntil:
          visible:
            id: 'passage-header'
          timeout: 60000
      - runFlow:
          when:
            true: ${output.expectRecordWarning == 'taken'}
          commands:
            - assertVisible:
                id: 'passage-notices-taken'
            - assertNotVisible:
                id: 'passage-notices-conflict'
      - runFlow:
          when:
            true: ${output.expectRecordWarning == 'conflict'}
          commands:
            - assertVisible:
                id: 'passage-notices-conflict'
      - back
      - extendedWaitUntil:
          visible:
            id: 'book-header'
          timeout: 30000

- tapOn:
    id: 'book-back'
- runFlow: ../../shared/nav/goto-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
