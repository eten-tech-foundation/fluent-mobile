# Ownership UI: mine / other / unassigned on the Next book page (#574).
# Next map: chapter-row + chapter-ownership-* → book-chapter-*-meta
# ("Yours" / "Someone else's" / "Unassigned"); record-taken-warning →
# passage-notices-taken. Requires MAESTRO_FIXTURE_PROJECT_NAME plus
# MINE / OTHER / UNASSIGNED chapter assignment ids.
appId: com.eten.fluent
tags:
  - ownership
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- scrollUntilVisible:
    element:
      text: '.*${MAESTRO_FIXTURE_PROJECT_NAME}.*'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- tapOn:
    text: '.*${MAESTRO_FIXTURE_PROJECT_NAME}.*'
- runFlow:
    when:
      visible:
        id: 'passage-header'
    commands:
      - tapOn:
          id: 'passage-title'
      - extendedWaitUntil:
          visible:
            id: 'passage-title-sheet'
          timeout: 15000
      - tapOn:
          id: 'passage-book'
- extendedWaitUntil:
    visible:
      id: 'book-header'
    timeout: 60000
- repeat:
    times: 12
    commands:
      - swipe:
          from:
            id: 'book-list'
          direction: DOWN
          duration: 250

# Single-book galleries title the section "Chapter N". That title is not a
# descendant Maestro can scope under book-chapter-*. Pin each row by id.
- evalScript: >-
    ${output.mineChapterId = (typeof MAESTRO_FIXTURE_MINE_CHAPTER_ID === 'undefined' || MAESTRO_FIXTURE_MINE_CHAPTER_ID === null) ? '' : String(MAESTRO_FIXTURE_MINE_CHAPTER_ID).trim()}
- evalScript: >-
    ${output.otherChapterId = (typeof MAESTRO_FIXTURE_OTHER_CHAPTER_ID === 'undefined' || MAESTRO_FIXTURE_OTHER_CHAPTER_ID === null) ? '' : String(MAESTRO_FIXTURE_OTHER_CHAPTER_ID).trim()}
- evalScript: >-
    ${output.unassignedChapterId = (typeof MAESTRO_FIXTURE_UNASSIGNED_CHAPTER_ID === 'undefined' || MAESTRO_FIXTURE_UNASSIGNED_CHAPTER_ID === null) ? '' : String(MAESTRO_FIXTURE_UNASSIGNED_CHAPTER_ID).trim()}
- assertTrue: ${/^[1-9][0-9]*$/.test(output.mineChapterId)}
- assertTrue: ${/^[1-9][0-9]*$/.test(output.otherChapterId)}
- assertTrue: ${/^[1-9][0-9]*$/.test(output.unassignedChapterId)}

# Mine — chapterMeta is "Draft · Yours · …" (full-string match on Maestro 2.10).
- scrollUntilVisible:
    element:
      id: '^book-chapter-${output.mineChapterId}$'
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
- assertVisible:
    id: '^book-chapter-${output.mineChapterId}-meta$'
    text: '(.* · )?Yours( · .*)?'

# Other
- scrollUntilVisible:
    element:
      id: '^book-chapter-${output.otherChapterId}$'
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
- assertVisible:
    id: '^book-chapter-${output.otherChapterId}-meta$'
    text: "(.* · )?Someone else's( · .*)?"

# Unassigned → open that chapter's Passage; Record has no taken notice
- scrollUntilVisible:
    element:
      id: '^book-chapter-${output.unassignedChapterId}$'
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
- assertVisible:
    id: '^book-chapter-${output.unassignedChapterId}-meta$'
    text: '(.* · )?Unassigned( · .*)?'
- assertNotVisible:
    id: '^book-chapter-${output.unassignedChapterId}-meta$'
    text: '(.* · )?Yours( · .*)?'
- tapOn:
    id: '^book-passage-${output.unassignedChapterId}-.*'
- extendedWaitUntil:
    visible:
      id: 'passage-header'
    timeout: 60000
- assertVisible:
    id: 'passage-record|passage-listen'
- assertNotVisible:
    id: 'passage-notices-taken'
