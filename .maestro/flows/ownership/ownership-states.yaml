# Ownership UI: mine / other / unassigned on the Next book page (#574).
# Next map: chapter-row + chapter-ownership-* → book-chapter-*-meta
# ("Yours" / "Someone else's" / "Unassigned"); record-taken-warning →
# passage-notices-taken. Requires MAESTRO_FIXTURE_PROJECT_NAME plus
# MINE / OTHER / UNASSIGNED labels.
appId: com.eten.fluent
tags:
  - ownership
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- scrollUntilVisible:
    element:
      text: '.*${MAESTRO_FIXTURE_PROJECT_NAME}.*'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- tapOn:
    text: '.*${MAESTRO_FIXTURE_PROJECT_NAME}.*'
- runFlow:
    when:
      visible:
        id: 'passage-header'
    commands:
      - tapOn:
          id: 'passage-title'
      - extendedWaitUntil:
          visible:
            id: 'passage-title-sheet'
          timeout: 15000
      - tapOn:
          id: 'passage-book'
- extendedWaitUntil:
    visible:
      id: 'book-header'
    timeout: 60000
- repeat:
    times: 12
    commands:
      - swipe:
          from:
            id: 'book-list'
          direction: DOWN
          duration: 250

# Mine — chapterMeta is "Draft · Yours · …" (full-string match on Maestro 2.10).
- scrollUntilVisible:
    element:
      text: ${MAESTRO_FIXTURE_MINE_LABEL}
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
- assertVisible:
    id: 'book-chapter-[0-9]+-meta'
    text: '(.* · )?Yours( · .*)?'
    childOf:
      id: 'book-chapter-[0-9]+'
      containsDescendants:
        - text: ${MAESTRO_FIXTURE_MINE_LABEL}

# Other
- scrollUntilVisible:
    element:
      text: ${MAESTRO_FIXTURE_OTHER_LABEL}
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
- assertVisible:
    id: 'book-chapter-[0-9]+-meta'
    text: "(.* · )?Someone else's( · .*)?"
    childOf:
      id: 'book-chapter-[0-9]+'
      containsDescendants:
        - text: ${MAESTRO_FIXTURE_OTHER_LABEL}

# Unassigned → open that chapter's Passage; Record has no taken notice
- scrollUntilVisible:
    element:
      text: ${MAESTRO_FIXTURE_UNASSIGNED_LABEL}
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
- assertVisible:
    id: 'book-chapter-[0-9]+-meta'
    text: '(.* · )?Unassigned( · .*)?'
    childOf:
      id: 'book-chapter-[0-9]+'
      containsDescendants:
        - text: ${MAESTRO_FIXTURE_UNASSIGNED_LABEL}
- assertNotVisible:
    id: 'book-chapter-[0-9]+-meta'
    text: '(.* · )?Yours( · .*)?'
    childOf:
      id: 'book-chapter-[0-9]+'
      containsDescendants:
        - text: ${MAESTRO_FIXTURE_UNASSIGNED_LABEL}
- tapOn:
    id: 'book-passage-[0-9]+-.*'
    childOf:
      id: 'book-chapter-[0-9]+'
      containsDescendants:
        - text: ${MAESTRO_FIXTURE_UNASSIGNED_LABEL}
- extendedWaitUntil:
    visible:
      id: 'passage-header'
    timeout: 60000
- assertVisible:
    id: 'passage-record|passage-listen'
- assertNotVisible:
    id: 'passage-notices-taken'
