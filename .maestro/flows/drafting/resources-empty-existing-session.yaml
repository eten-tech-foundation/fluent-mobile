# READ-ONLY: Next resources EMPTY for an EXISTING empty fixture chapter.
#
# Next map: resources-tab empty copy → passage-images-unprepared /
# passage-questions-unprepared (device_inventory) or passage-images-empty /
# passage-questions-empty (none_for_verse).
#
# Required env (fail if absent/invalid — no skip/auth/network fallback):
# - MAESTRO_EXPECT_RESOURCES_EMPTY_FIXTURE
#     Chapter assignment id for home-next-{id}:….
# - MAESTRO_EXPECT_RESOURCES_EMPTY_KIND = device_inventory | none_for_verse
#
# Forbidden: clearState, login/warm-session, airplane/network toggles,
# Prepare for Offline download, section expansion that assumes content.
appId: com.eten.fluent
tags:
  - drafting
  - existing-session
  - read-only
  - fixture-blocked
---
- runScript: ../../shared/scripts/resources-empty-values.js
- assertTrue: ${output.emptyFixture.length > 0 && Number(output.emptyFixture) > 0}
- assertTrue: ${['device_inventory','none_for_verse'].indexOf(output.emptyKind) >= 0}
- assertNotVisible:
    id: 'login-email-input'
# open-my-work-chapter copies MAESTRO_FIXTURE_CHAPTER_ID onto output — override
# so this empty fixture is not replaced by the default draft chapter.
- runFlow:
    file: ../../shared/nav/open-my-work-chapter.yaml
    env:
      MAESTRO_FIXTURE_CHAPTER_ID: ${MAESTRO_EXPECT_RESOURCES_EMPTY_FIXTURE}
- assertVisible:
    id: 'passage-header'
- tapOn:
    id: 'passage-resources-open'
- extendedWaitUntil:
    visible:
      id: 'passage-resources'
    timeout: 30000
- runFlow:
    when:
      true: ${output.emptyKind == 'device_inventory'}
    commands:
      - assertVisible:
          id: 'passage-images-unprepared|passage-images-none-offline'
- runFlow:
    when:
      true: ${output.emptyKind == 'none_for_verse'}
    commands:
      - assertVisible:
          id: 'passage-images-empty|passage-images-no-text'
- tapOn:
    id: 'passage-resources-collapse'
- tapOn:
    id: 'passage-title'
- extendedWaitUntil:
    visible:
      id: 'passage-title-sheet'
    timeout: 15000
- tapOn:
    id: 'passage-open-questions'
- extendedWaitUntil:
    visible:
      id: 'passage-questions'
    timeout: 30000
- runFlow:
    when:
      true: ${output.emptyKind == 'device_inventory'}
    commands:
      - assertVisible:
          id: 'passage-questions-unprepared'
- runFlow:
    when:
      true: ${output.emptyKind == 'none_for_verse'}
    commands:
      - assertVisible:
          id: 'passage-questions-empty|passage-questions-no-text'
- back
- runFlow: ../../shared/nav/goto-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
