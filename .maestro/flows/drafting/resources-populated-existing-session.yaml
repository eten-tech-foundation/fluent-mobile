# READ-ONLY: Next resources POPULATED — expand images dock or Translation
# Questions, require a content marker, collapse. Existing session.
# Populated fixture is UNPROVEN — tagged fixture-blocked.
#
# Next map: resources-tab sections → passage-resources (images) and
# passage-questions (title sheet). translation_notes stay in the script.
#
# Required env (fail if absent/invalid — no skip/auth/network/download fallback):
# - MAESTRO_EXPECT_RESOURCES_POPULATED_FIXTURE
#     Chapter assignment id for home-next-{id}:… (positive digits).
# - MAESTRO_EXPECT_RESOURCES_POPULATED_SECTION
#     Enum: translation_notes | translation_questions | images_maps
# - MAESTRO_EXPECT_RESOURCES_CONTENT_MARKER
#     Required nonempty exact body text visible only when the chosen section is
#     expanded. Must NOT equal chrome labels.
#
# Forbidden: clearState, login/warm-session, airplane/network toggles,
# Prepare for Offline download, optional when: skip-green branches.
appId: com.eten.fluent
tags:
  - drafting
  - existing-session
  - fixture-blocked
---
- runScript: ../../shared/scripts/resources-populated-values.js
- evalScript: >-
    ${output.populatedChapterId = (typeof MAESTRO_EXPECT_RESOURCES_POPULATED_FIXTURE === 'undefined' || MAESTRO_EXPECT_RESOURCES_POPULATED_FIXTURE === null) ? '' : String(MAESTRO_EXPECT_RESOURCES_POPULATED_FIXTURE).trim()}
- assertTrue: ${/^[1-9][0-9]*$/.test(output.populatedFixture)}
- assertTrue: ${['translation_notes','translation_questions','images_maps'].indexOf(output.sectionEnum) >= 0}
- assertTrue: ${typeof output.contentMarker === 'string' && output.contentMarker.length > 0}
- assertTrue: ${output.contentMarker !== 'Translation Notes' && output.contentMarker !== 'Translation Questions' && output.contentMarker !== 'Images & Maps'}
- assertTrue: ${typeof output.contentMarkerRe === 'string' && output.contentMarkerRe.length > 0}
- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/goto-home.yaml
- evalScript: >-
    ${output.fixtureChapterId = output.populatedChapterId}
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- assertVisible:
    id: 'passage-header'
- runFlow:
    when:
      true: ${output.sectionEnum == 'images_maps'}
    commands:
      - tapOn:
          id: 'passage-resources-open'
      - extendedWaitUntil:
          visible:
            id: 'passage-resources'
          timeout: 30000
      - extendedWaitUntil:
          visible:
            text: ${output.contentMarkerRe}
          timeout: 30000
      - tapOn:
          id: 'passage-resources-collapse'
      - extendedWaitUntil:
          notVisible:
            text: ${output.contentMarkerRe}
          timeout: 15000
- runFlow:
    when:
      true: ${output.sectionEnum == 'translation_questions'}
    commands:
      - tapOn:
          id: 'passage-title'
      - extendedWaitUntil:
          visible:
            id: 'passage-title-sheet'
          timeout: 15000
      - tapOn:
          id: 'passage-open-questions'
      - extendedWaitUntil:
          visible:
            id: 'passage-questions'
          timeout: 30000
      - extendedWaitUntil:
          visible:
            text: ${output.contentMarkerRe}
          timeout: 30000
      - back
      - extendedWaitUntil:
          notVisible:
            id: 'passage-questions'
          timeout: 15000
- runFlow:
    when:
      true: ${output.sectionEnum == 'translation_notes'}
    commands:
      - extendedWaitUntil:
          visible:
            text: ${output.contentMarkerRe}
          timeout: 30000
- runFlow: ../../shared/nav/goto-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
