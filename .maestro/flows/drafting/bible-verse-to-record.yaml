# Selecting a verse on Next Passage opens Listen on the same screen
# (no drafting-tab-record hop). passage-script-verse-* is a non-pressable
# Text; the row (VerseList) is the tap target. Verse-mode fixture required —
# pericope script-only Passages have no verse rows (Blocked, not skip-green).
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/ensure/ensure-signed-in.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- assertVisible:
    id: 'passage-header'
- assertVisible:
    id: 'passage-record|passage-listen'
- scrollUntilVisible:
    element:
      id: 'passage-verse-row-[0-9]+'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'passage-verse-row-[0-9]+'
- extendedWaitUntil:
    visible:
      id: 'passage-player'
    timeout: 15000
- assertVisible:
    id: 'passage-verse-position'
