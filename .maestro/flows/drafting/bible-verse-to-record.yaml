# Selecting a verse on Next Passage keeps Record on the same screen
# (no drafting-tab-record hop). Verse chrome is passage-script-verse-* /
# passage-verse-row-*; Record is passage-record / passage-listen.
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/ensure/ensure-signed-in.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- assertVisible:
    id: 'passage-header'
- assertVisible:
    id: 'passage-record|passage-listen'
- assertVisible:
    id: 'passage-script-verse-[0-9]+|passage-verse-row-[0-9]+'
- tapOn:
    id: 'passage-script-verse-[0-9]+|passage-verse-row-[0-9]+'
- assertVisible:
    id: 'passage-record|passage-listen|passage-player'
