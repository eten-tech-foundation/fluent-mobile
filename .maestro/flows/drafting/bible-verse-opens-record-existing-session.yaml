# Tapping the verse row opens Listen on Next Passage at that verse.
# passage-script-verse-* is non-pressable Text — do not tap it.
# Existing signed-in session. Required: MAESTRO_FIXTURE_CHAPTER_ID,
# MAESTRO_FIXTURE_VERSE_NUMBER, MAESTRO_EXPECT_RECORD_REFERENCE
# (fixture wiring; UI proof is passage-verse-position).
# No capture, playback, claim, sync, login, or state reset.
appId: com.eten.fluent
tags:
  - drafting
  - existing-session
  - read-only
  - fixture-blocked
---
- runScript: ../../shared/scripts/bible-record-values.js
- evalScript: >-
    ${output.fixtureChapterId = (typeof MAESTRO_FIXTURE_CHAPTER_ID === 'undefined' || MAESTRO_FIXTURE_CHAPTER_ID === null) ? '' : String(MAESTRO_FIXTURE_CHAPTER_ID).trim()}
- evalScript: >-
    ${output.fixtureVerseNumber = (typeof MAESTRO_FIXTURE_VERSE_NUMBER === 'undefined' || MAESTRO_FIXTURE_VERSE_NUMBER === null) ? '' : String(MAESTRO_FIXTURE_VERSE_NUMBER).trim()}
- assertTrue: ${typeof output.fixtureChapterId === 'string' && /^[1-9][0-9]*$/.test(output.fixtureChapterId)}
- assertTrue: ${typeof output.fixtureVerseNumber === 'string' && /^[1-9][0-9]*$/.test(output.fixtureVerseNumber)}
- assertTrue: ${typeof output.expectRecordReference === 'string' && output.expectRecordReference.length > 0 && output.expectRecordReference.endsWith(':' + output.fixtureVerseNumber)}
- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- assertVisible:
    id: 'passage-header'
- assertVisible:
    id: 'passage-record|passage-listen'
- scrollUntilVisible:
    element:
      id: '${output.passageVerseRowIdRe}'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: '${output.passageVerseRowIdRe}'
- extendedWaitUntil:
    visible:
      id: 'passage-player'
    timeout: 15000
- assertVisible:
    id: 'passage-verse-position'
    text: 'Verse ${output.fixtureVerseNumber}(, recorded)?, .*'
- runFlow: ../../shared/nav/goto-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
