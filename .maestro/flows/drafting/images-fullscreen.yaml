# Images & Maps fullscreen close when a thumbnail is available (optional).
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- tapOn:
    id: 'drafting-tab-resources'
- assertVisible:
    id: 'resources-tab'
- runFlow:
    when:
      visible:
        id: 'resources-section-imagesMaps-toggle'
    commands:
      - tapOn:
          id: 'resources-section-imagesMaps-toggle'
- runFlow:
    when:
      visible:
        id: 'images-maps-thumbnail-.*'
    commands:
      - tapOn:
          id: 'images-maps-thumbnail-.*'
      - extendedWaitUntil:
          visible:
            id: 'images-maps-fullscreen-close'
          timeout: 15000
      - tapOn:
          id: 'images-maps-fullscreen-close'
- assertVisible:
    id: 'resources-tab'
