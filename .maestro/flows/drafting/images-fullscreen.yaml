# Images grow in the Next resources card (passage-image-*-zoom), not Legacy
# images-maps-maximize. Requires MAESTRO_FIXTURE_PROJECT_NAME +
# MAESTRO_FIXTURE_MINE_LABEL (chapter with images).
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow:
    file: ../../shared/nav/open-fixture-chapter.yaml
    env:
      MAESTRO_FIXTURE_CHAPTER_LABEL: ${MAESTRO_FIXTURE_MINE_LABEL}
- assertVisible:
    id: 'passage-header'
- tapOn:
    id: 'passage-resources-open'
- extendedWaitUntil:
    visible:
      id: 'passage-resources'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'passage-images-list'
    timeout: 30000
- tapOn:
    id: 'passage-image-.*-zoom'
- extendedWaitUntil:
    visible:
      id: 'passage-image-.*'
    timeout: 15000
- tapOn:
    id: 'passage-resources-collapse'
- assertVisible:
    id: 'passage-header'
