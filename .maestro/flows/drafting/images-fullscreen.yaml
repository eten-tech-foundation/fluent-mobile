# Images grow in the Next resources card (passage-image-*-zoom), not Legacy
# images-maps-maximize. Opens the pinned chapter by id (Next up), not by
# book-page label: a single-book gallery titles the section "Chapter N",
# while the cover eyebrow is "Psalms N". Requires
# MAESTRO_FIXTURE_CHAPTER_ID + MAESTRO_FIXTURE_MINE_LABEL.
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- assertTrue: ${typeof MAESTRO_FIXTURE_MINE_LABEL !== 'undefined' && String(MAESTRO_FIXTURE_MINE_LABEL).trim().length > 0}
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- assertVisible:
    id: 'passage-header'
- tapOn:
    id: 'passage-resources-open'
- extendedWaitUntil:
    visible:
      id: 'passage-resources'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'passage-images-list'
    timeout: 30000
# passage-image-* is on the collapsed tile. Caption exists only when grown.
- assertNotVisible:
    id: 'passage-image-.*-caption'
- tapOn:
    id: 'passage-image-.*-zoom'
- extendedWaitUntil:
    visible:
      id: 'passage-image-.*-caption'
    timeout: 15000
- tapOn:
    id: 'passage-image-.*-toggle'
- extendedWaitUntil:
    notVisible:
      id: 'passage-image-.*-caption'
    timeout: 15000
- tapOn:
    id: 'passage-resources-collapse'
- assertVisible:
    id: 'passage-header'
