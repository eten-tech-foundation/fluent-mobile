# Images grow in the Next resources card (passage-image-*-zoom), not Legacy
# images-maps-maximize. A single-book gallery titles the section "Chapter N",
# while the cover eyebrow is "Psalms N". Next up only lists five chapters,
# so this opens the book by project name and pins the row by assignment id.
# Requires MAESTRO_FIXTURE_CHAPTER_ID + MAESTRO_FIXTURE_MINE_LABEL.
# fixture-blocked keeps default lanes from selecting this without that id.
appId: com.eten.fluent
tags:
  - drafting
  - fixture-blocked
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- assertTrue: ${typeof MAESTRO_FIXTURE_MINE_LABEL !== 'undefined' && String(MAESTRO_FIXTURE_MINE_LABEL).trim().length > 0}
- runFlow:
    file: ../../shared/nav/open-fixture-chapter.yaml
    env:
      MAESTRO_FIXTURE_OPEN_CHAPTER_ID: ${MAESTRO_FIXTURE_CHAPTER_ID}
- assertVisible:
    id: 'passage-header'
- tapOn:
    id: 'passage-resources-open'
- extendedWaitUntil:
    visible:
      id: 'passage-resources'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'passage-images-list'
    timeout: 30000
# passage-image-* is on the collapsed tile. Caption exists only when grown.
- assertNotVisible:
    id: 'passage-image-.*-caption'
- tapOn:
    id: 'passage-image-.*-zoom'
- extendedWaitUntil:
    visible:
      id: 'passage-image-.*-caption'
    timeout: 15000
- tapOn:
    id: 'passage-image-.*-toggle'
- extendedWaitUntil:
    notVisible:
      id: 'passage-image-.*-caption'
    timeout: 15000
- tapOn:
    id: 'passage-resources-collapse'
- assertVisible:
    id: 'passage-header'
