# Images & Maps fullscreen open/close on a fixture chapter known to have images.
# Requires MAESTRO_FIXTURE_PROJECT_NAME + MAESTRO_FIXTURE_MINE_LABEL (Mark 1 in the
# disposable ownership fixture — assessment confirmed images on Mark 1).
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow:
    file: ../../shared/nav/open-fixture-chapter.yaml
    env:
      MAESTRO_FIXTURE_CHAPTER_LABEL: ${MAESTRO_FIXTURE_MINE_LABEL}
- tapOn:
    id: 'drafting-tab-resources'
- assertVisible:
    id: 'resources-tab'
- extendedWaitUntil:
    visible:
      id: 'resources-section-imagesMaps-toggle'
    timeout: 30000
- tapOn:
    id: 'resources-section-imagesMaps-toggle'
# Maximize control (not the removed images-maps-thumbnail-* id) — required (#597).
- extendedWaitUntil:
    visible:
      id: 'images-maps-maximize-.*'
    timeout: 30000
- tapOn:
    id: 'images-maps-maximize-.*'
- extendedWaitUntil:
    visible:
      id: 'images-maps-fullscreen-close'
    timeout: 15000
- tapOn:
    id: 'images-maps-fullscreen-close'
- assertVisible:
    id: 'resources-tab'
