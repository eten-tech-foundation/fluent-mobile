# Source audio dock chrome on drafting (when dock present).
appId: com.eten.fluent
tags:
  - drafting
  - source-audio
---
- runFlow: ../../shared/ensure/ensure-warm-home.yaml
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- tapOn:
    id: 'drafting-tab-bible'
- extendedWaitUntil:
    visible:
      id: 'source-audio-bar'
    timeout: 30000
- assertVisible:
    id: 'source-audio-time-elapsed'
- tapOn:
    id: 'source-audio-play'
- extendedWaitUntil:
    visible:
      id: 'source-audio-playing'
    timeout: 15000
