# Source audio on Next Passage is the Listen player (passage-listen), not a
# Bible-tab dock. Assert the player chrome when Listen is offered.
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- assertVisible:
    id: 'passage-header'
- assertVisible:
    id: 'passage-listen'
- tapOn:
    id: 'passage-listen'
- extendedWaitUntil:
    visible:
      id: 'passage-player'
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: 'passage-header'
    timeout: 15000
