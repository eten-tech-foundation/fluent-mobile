# Next Passage chrome (no drafting tabs): script/record, resources dock,
# Translation Questions via the title sheet. Never taps passage-classic.
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- assertVisible:
    id: 'passage-header|observer-screen'
- runFlow:
    when:
      visible:
        id: 'passage-header'
    commands:
      - assertVisible:
          id: 'passage-record|passage-listen'
      - assertVisible:
          id: 'passage-resources-peek|passage-resources-open'
      - tapOn:
          id: 'passage-title'
      - extendedWaitUntil:
          visible:
            id: 'passage-title-sheet'
          timeout: 15000
      - assertVisible:
          id: 'passage-open-questions'
      - back
      - extendedWaitUntil:
          visible:
            id: 'passage-header'
          timeout: 15000
      - assertVisible:
          id: 'passage-record|passage-listen'
