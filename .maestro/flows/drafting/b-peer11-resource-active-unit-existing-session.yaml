# D-0188-02: actual UI-verified distinct verse resources follow Bible→Record→Resources.
# C-0146-02: checked=false paired with independent fresh-device/no-pref-write history.
# No recording Start/Pause/Save/Delete, preference taps, downloads or auth.
appId: com.eten.fluent
tags:
  - drafting
  - existing-session
  - read-only
  - guard
