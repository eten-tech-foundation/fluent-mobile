# Next resources: expand/collapse the docked images card, and open
# Translation Questions from the title sheet. Never taps passage-classic.
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- assertVisible:
    id: 'passage-header'
- tapOn:
    id: 'passage-resources-open'
- extendedWaitUntil:
    visible:
      id: 'passage-resources'
    timeout: 15000
- assertVisible:
    id: 'passage-images-list|passage-images-empty|passage-images-unprepared|passage-images-loading|passage-images-none-offline|passage-images-error|passage-images-no-text'
- tapOn:
    id: 'passage-resources-collapse'
- tapOn:
    id: 'passage-title'
- extendedWaitUntil:
    visible:
      id: 'passage-title-sheet'
    timeout: 15000
- tapOn:
    id: 'passage-open-questions'
- extendedWaitUntil:
    visible:
      id: 'passage-questions'
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: 'passage-header'
    timeout: 15000
