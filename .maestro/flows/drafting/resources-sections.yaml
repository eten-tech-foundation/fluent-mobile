# Resources sections expand/collapse chrome.
# Same disposable fixture chapter as images-fullscreen (known populated Images
# section). First My Work row can be an online empty verse with no toggles.
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: ../../shared/ensure/ensure-warm-home.yaml
- runFlow:
    file: ../../shared/nav/open-fixture-chapter.yaml
    env:
      MAESTRO_FIXTURE_CHAPTER_LABEL: ${MAESTRO_FIXTURE_MINE_LABEL}
- tapOn:
    id: 'drafting-tab-resources'
- assertVisible:
    id: 'resources-tab'
- extendedWaitUntil:
    visible:
      id: 'resources-section-.*-toggle'
    timeout: 30000
- tapOn:
    id: 'resources-section-.*-toggle'
- assertVisible:
    id: 'resources-section-.*'
