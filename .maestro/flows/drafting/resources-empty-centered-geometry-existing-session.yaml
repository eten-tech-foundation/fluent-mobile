# D-0188-03: centered empty Resources geometry on EXISTING fixture484.
# Read-only. Does not re-prove the copy-only empty Resources PASS; asserts
# empty host + exact none_for_verse copy only as geometry anchors, then
# returns Home. Root/host measures panel + message bounds from view hierarchy
# while this screen is up (see T7 receipt). No tab-order or account matrix.
#
# Preconditions: device A baseline active12 / cache 10,9,12. This single flow
# switches 12→10, opens fixture484 Resources empty, and LEAVES the empty
# Resources screen up so the host can dump view-hierarchy bounds after Maestro
# exits (concurrent maestro hierarchy/uiautomator during test kills the device
# server). Host then returns Home and restores account 12.
# Online-empty kind none_for_verse.
# Required env:
#   MAESTRO_EXPECT_RESOURCES_EMPTY_FIXTURE=484
#   MAESTRO_EXPECT_RESOURCES_EMPTY_KIND=none_for_verse
#   MAESTRO_D0188_GEOMETRY_ATTESTATION=1
#
# Forbidden: Download, sync, capture, playback, toggles, login/logout/reset,
# clearState, DB write, network/permission change, app kill/reload, stage writes.
appId: com.eten.fluent
tags:
  - drafting
  - existing-session
  - read-only
  - fixture-blocked
---
- runScript: ../../shared/scripts/resources-empty-values.js
- assertTrue: ${output.emptyFixture === '484'}
- assertTrue: ${output.emptyKind === 'none_for_verse'}
- assertTrue: ${output.emptyMessage === 'No resources available for this verse'}
- assertTrue: ${typeof output.emptyMessageRe === 'string' && output.emptyMessageRe.length > 0}
- assertTrue: ${typeof MAESTRO_D0188_GEOMETRY_ATTESTATION !== 'undefined' && String(MAESTRO_D0188_GEOMETRY_ATTESTATION).trim() === '1'}

- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/goto-home.yaml
- assertVisible:
    id: 'home-tab-my-work'
- assertVisible:
    id: 'home-settings-button'
# Cached switch 12 → 10 (existing session only).
- tapOn:
    id: 'home-settings-button'
- extendedWaitUntil:
    visible:
      id: 'settings-drawer-content'
    timeout: 15000
- assertVisible:
    id: 'settings-menu-active-12'
- assertVisible:
    id: 'settings-menu-account-10'
- assertVisible:
    id: 'settings-menu-account-9'
- assertVisible:
    id: 'settings-menu-account-12'
- tapOn:
    id: 'settings-menu-account-10'
- repeat:
    times: 4
    while:
      visible:
        id: 'prepare-offline-screen'
    commands:
      - tapOn:
          id: 'stack-header-back'
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 90000
- assertNotVisible:
    id: 'login-email-input'
- tapOn:
    id: 'home-tab-my-work'
- scrollUntilVisible:
    element:
      id: 'my-work-row-484'
    direction: DOWN
    timeout: 60000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- tapOn:
    id: 'my-work-row-484'
- extendedWaitUntil:
    visible:
      id: 'drafting-tab-bar'
    timeout: 60000
- tapOn:
    id: 'drafting-tab-resources'
- extendedWaitUntil:
    notVisible:
      id: 'resources-tab-loading'
    timeout: 30000
- assertVisible:
    id: 'resources-tab'
- assertVisible:
    text: ${output.emptyMessageRe}
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: d0188-03-empty-resources-geometry
- assertVisible:
    id: 'resources-tab'
- assertVisible:
    text: ${output.emptyMessageRe}
# End on empty Resources so host can dump hierarchy bounds after Maestro exits.
