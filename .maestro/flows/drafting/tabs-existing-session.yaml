# Next Passage chrome (no drafting tabs), existing session.
# Requires: logged-in app, Home reachable, Next up (or book) shows the fixture.
# MAESTRO_FIXTURE_CHAPTER_ID: required digits /^[1-9][0-9]*$/.
# No login or clearState. Never taps passage-classic.
appId: com.eten.fluent
tags:
  - drafting
  - existing-session
  - ordered-readonly
  - fixture-blocked
---
- evalScript: >-
    ${output.fixtureChapterId = (typeof MAESTRO_FIXTURE_CHAPTER_ID === 'undefined' || MAESTRO_FIXTURE_CHAPTER_ID === null) ? '' : String(MAESTRO_FIXTURE_CHAPTER_ID).trim()}
- assertTrue: ${typeof output.fixtureChapterId === 'string' && /^[1-9][0-9]*$/.test(output.fixtureChapterId)}
- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- assertVisible:
    id: 'passage-header|observer-screen'
- runFlow:
    when:
      visible:
        id: 'passage-header'
    commands:
      - assertVisible:
          id: 'passage-record|passage-listen'
      - assertVisible:
          id: 'passage-resources-peek|passage-resources-open'
      - tapOn:
          id: 'passage-title'
      - extendedWaitUntil:
          visible:
            id: 'passage-title-sheet'
          timeout: 15000
      - assertVisible:
          id: 'passage-open-questions'
      - back
      - extendedWaitUntil:
          visible:
            id: 'passage-header'
          timeout: 15000
- runFlow: ../../shared/nav/goto-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
