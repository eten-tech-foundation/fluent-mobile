# Wrong credentials → login-global-error, stay on login.
appId: com.eten.fluent
tags:
  - smoke
  - edges
  - validation
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- tapOn:
    id: 'login-email-input'
- eraseText
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: 'login-password-input'
- eraseText
- inputText: definitely-wrong-password-xyz
- hideKeyboard
- tapOn:
    id: 'login-submit-button'
- extendedWaitUntil:
    visible:
      id: 'login-global-error'
    timeout: 60000
- assertVisible:
    id: 'login-email-input'
