# Deep link into app (fluent://) lands without crash — asserts Home or login chrome.
appId: com.eten.fluent
tags:
  - edges
  - deeplink
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- openLink: fluent://home
- runFlow: ../../helpers/boot-past-dev-launcher.yaml
- runFlow:
    when:
      visible:
        id: 'login-email-input'
    commands:
      - assertVisible:
          id: 'login-email-input'
- runFlow:
    when:
      visible:
        id: 'home-tab-my-work'
    commands:
      - assertVisible:
          id: 'home-tab-my-work'
