# READ-ONLY: Home drawer → Terms of Use document → header back → Home.
#
# Preconditions: existing logged-in session; unblocked Home.
# Distinct from edges/legal-pages.yaml (login footer) and
# settings-privacy-existing-session.yaml (Privacy only).
# Uses terms-of-use-scroll-back (not system Back). Never accept agreements,
# account/password controls, login/logout, downloads, or pref toggles.
# Does not edit frozen Sync/PFO six-path or Privacy two-path checkpoints.
appId: com.eten.fluent
tags:
  - edges
  - existing-session
  - read-only
---
- assertNotVisible:
    id: 'login-email-input'
- assertVisible:
    id: 'home-tab-my-work'
- tapOn:
    id: 'home-settings-button'
- tapOn:
    id: 'settings-menu-terms-of-use'
- extendedWaitUntil:
    visible:
      id: 'terms-of-use-scroll'
    timeout: 15000
- tapOn:
    id: 'terms-of-use-scroll-back'
- runFlow: ../../shared/nav/goto-home.yaml
- assertVisible:
    id: 'home-tab-my-work'
- assertNotVisible:
    id: 'login-email-input'
