# Home exposes exactly one Sync entry (the header button). Existing session.
# Next has no My Work / Projects tabs — one home-sync on home-header.
# MAESTRO_PREPARED_PHASE_OK=1 attests the operator verified the prepared Home
# state (signed in, no active work) before running. Any other value fails.
# No Sync Now/retry/preferences/accounts/network/auth/recording/download actions.
appId: com.eten.fluent
tags: [edges, existing-session, read-only, prepared-phase, fixture-blocked]
---
- assertTrue: ${typeof MAESTRO_PREPARED_PHASE_OK !== 'undefined' && MAESTRO_PREPARED_PHASE_OK === '1'}
- assertVisible:
    id: home-header
- assertNotVisible:
    id: login-email-input
- assertVisible:
    id: home-sync
- assertNotVisible:
    id: 'sync-action-(sync-now|pause|resume|cancel)'
- assertNotVisible: '^Sync Now$'
- assertNotVisible:
    id: sync-screen
- takeScreenshot: home-single-sync-entry
- runFlow: ../../shared/nav/goto-sync.yaml
- assertVisible:
    id: sync-screen
- assertNotVisible:
    id: login-email-input
- takeScreenshot: sync-screen-shell
- back
- extendedWaitUntil:
    visible:
      id: home-header
    timeout: 10000
- assertNotVisible:
    id: sync-screen
