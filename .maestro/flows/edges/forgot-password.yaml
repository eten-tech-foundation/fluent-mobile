# Forgot password happy path → sent view → back to login.
appId: com.eten.fluent
tags:
  - smoke
  - edges
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- tapOn:
    id: 'login-forgot-password-link'
- extendedWaitUntil:
    visible:
      id: 'forgot-password-email-input'
    timeout: 15000
- tapOn:
    id: 'forgot-password-email-input'
- eraseText
- inputText: ${MAESTRO_EMAIL}
- hideKeyboard
- tapOn:
    id: 'forgot-password-submit-button'
- extendedWaitUntil:
    visible:
      id: 'forgot-password-sent-view'
    timeout: 60000
- tapOn:
    id: 'forgot-password-sent-back-link'
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 15000
