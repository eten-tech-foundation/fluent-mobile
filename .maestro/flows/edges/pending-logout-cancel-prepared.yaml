# #622 positive-pending guard only. Cancel both alerts, never confirmed logout.
# Root independently verified owner10 pending2, prefcellularOFF, noactivework,
# emulatorWiFiOFF prevents backgroundupload; originalWiFi/account restorefinally.
appId: com.eten.fluent
tags: [existing-session, prepared-phase, read-only]
---
- assertTrue: ${MAESTRO_A_PENDING_LOGOUT_CANCEL_VERIFIED === '1'}
- assertVisible:
    id: record-verse-reference
    text: '^1 Peter 1:1–2$'
- assertNotVisible:
    id: record-stop-button
- tapOn:
    id: drafting-header-back
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: chapter-row-1183
    timeout: 10000
- tapOn:
    id: stack-header-back
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: home-settings-button
    timeout: 10000
- tapOn:
    id: home-settings-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: settings-menu-active-10
- tapOn:
    id: settings-menu-more-settings
    waitToSettleTimeoutMs: 500
- tapOn:
    id: settings-drafting-unit-verse
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: settings-drafting-unit-verse
    selected: true
- scrollUntilVisible:
    element:
      id: settings-log-out
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings-log-out
    waitToSettleTimeoutMs: 500
- assertVisible: '^Unsynced work on device$'
- assertVisible: '^You have recordings that have not been uploaded. Log out anyway[?]$'
- assertVisible:
    id: android:id/button1
    text: '(?i)^log out$'
- assertVisible:
    id: android:id/button2
    text: '(?i)^cancel$'
- takeScreenshot: a-settings-unsynced-logout-confirmation
- tapOn:
    id: android:id/button2
    text: '(?i)^cancel$'
- assertNotVisible: '^Unsynced work on device$'
- assertVisible:
    id: settings-log-out
- tapOn:
    id: stack-header-back
    waitToSettleTimeoutMs: 500
- tapOn:
    id: home-settings-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: settings-menu-active-10
- tapOn:
    id: settings-menu-sign-out
    waitToSettleTimeoutMs: 500
- assertVisible: '^Unsynced work on device$'
- assertVisible: '^You have recordings that have not been uploaded. Log out anyway[?]$'
- assertVisible:
    id: android:id/button1
    text: '(?i)^log out$'
- assertVisible:
    id: android:id/button2
    text: '(?i)^cancel$'
- takeScreenshot: a-drawer-unsynced-logout-same-warning
- tapOn:
    id: android:id/button2
    text: '(?i)^cancel$'
- assertNotVisible: '^Unsynced work on device$'
- assertVisible:
    id: settings-menu-active-10
- pressKey: Back
- assertVisible:
    id: home-tab-my-work
- assertNotVisible:
    id: login-email-input
