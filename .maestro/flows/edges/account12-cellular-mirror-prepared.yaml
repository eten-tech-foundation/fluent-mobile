# A primary-device correction: grounded absolute point95%,7% reaches Sync in the executed Maestro flow; B element-relative point failed twice. Owner12 pending0, all-six owner10 takes protected.
# C-0146-03 live reversible app-local preference mirror, original OFF.
# Prepared start is Settings; root preflight active12/cache10,9,12, pending0,
# original OFF, WiFiON/airplaneOFF, no active transfers. A-prefixed guard keys
# normalize the executed B-prefixed variables with identical values/predicates.
# No SyncNow/Pause/Cancel/download/account/recording actions or OS network change.
appId: com.eten.fluent
tags:
  - settings
  - sync
  - existing-session
  - reversible-preference
  - guard
---
- runScript: ../../shared/scripts/account12-cellular-mirror-context.js
- assertNotVisible:
    id: '^login-email-input$'
- scrollUntilVisible:
    element:
      id: '^settings-upload-cellular-switch$'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: '^settings-upload-cellular-switch$'
    checked: false
- tapOn:
    id: '^settings-upload-cellular-switch$'
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: '^settings-upload-cellular-switch$'
    checked: true
- takeScreenshot: a-empty12-cellular-settings-on
- tapOn:
    id: '^stack-header-back$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^home-sync-button$'
    timeout: 15000
- tapOn:
    point: '95%,7%'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^sync-screen$'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: '^sync-upload-cellular-switch$'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: '^sync-upload-cellular-switch$'
    checked: true
- takeScreenshot: a-empty12-cellular-sync-mirrors-on
- tapOn:
    id: '^sync-upload-cellular-switch$'
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: '^sync-upload-cellular-switch$'
    checked: false
- takeScreenshot: a-empty12-cellular-sync-off
- tapOn:
    id: '^stack-header-back$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^home-settings-button$'
    timeout: 15000
- tapOn:
    id: '^home-settings-button$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^settings-menu-active-12$'
    timeout: 15000
- tapOn:
    id: '^settings-menu-more-settings$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^settings-ui-version$'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: '^settings-upload-cellular-switch$'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: '^settings-upload-cellular-switch$'
    checked: false
- takeScreenshot: a-empty12-cellular-settings-mirrors-off-restored
- tapOn:
    id: '^stack-header-back$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^home-tab-projects$'
    timeout: 15000
- assertNotVisible:
    id: '^login-email-input$'
