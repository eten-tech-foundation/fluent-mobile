# Signed-in fluent://home stays in the app. Existing session only: no launch,
# warm helper, or clearState.
appId: com.eten.fluent
tags:
  - edges
  - deeplink
  - existing-session
  - ordered-readonly
---
- assertNotVisible:
    id: 'login-email-input'
- assertVisible:
    id: 'home-header'
# Next has no /home route (`fluent://home` → Unmatched). Index `/` is Home
# when signed in. Mapping leftover `/home` URLs is #917.
- openLink: fluent:///
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
