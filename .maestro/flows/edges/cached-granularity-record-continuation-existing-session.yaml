# Continue verified Pericope1:1 source state; no capture/setup replay.
appId: com.eten.fluent
tags:
  - existing-session
  - fixture-blocked
  - preference-mutation-approved
---
- runScript: ../../shared/scripts/cached-granularity-context.js
- assertTrue: ${output.cachedUnitPhase === 'prepared-record-source'}
- assertVisible:
    id: record-tab
- assertVisible:
    id: record-verse-reference
    text: '^1 Peter 1:1–2$'
- assertVisible:
    id: record-source-body
- assertVisible:
    id: source-audio-paused
- assertVisible:
    id: ^bible-pericope-verse-1-1$
- assertVisible:
    id: ^bible-pericope-verse-1-2$
- assertNotVisible:
    id: ^bible-pericope-verse-1-3$
- scrollUntilVisible:
    element:
      text: ^multiplied\.\s*$
    direction: DOWN
    timeout: 10000
- takeScreenshot: cached-unit-record-pericope-source-partial
- tapOn:
    waitToSettleTimeoutMs: 500
    id: record-source-toggle
- tapOn:
    waitToSettleTimeoutMs: 500
    id: record-next-verse
- assertVisible:
    id: record-verse-reference
    text: '^1 Peter 1:3–5$'
- assertVisible:
    id: source-audio-label
    text: ^WEB Source Audio · Pericope 2 / 9$
- tapOn:
    waitToSettleTimeoutMs: 500
    id: record-prev-verse
- assertVisible:
    id: record-verse-reference
    text: '^1 Peter 1:1–2$'
- assertVisible:
    id: source-audio-label
    text: ^WEB Source Audio · Pericope 1 / 9$
- takeScreenshot: cached-unit-pericope-next-prev
- tapOn:
    waitToSettleTimeoutMs: 500
    id: drafting-header-back
- assertVisible:
    id: home-tab-my-work
- tapOn:
    waitToSettleTimeoutMs: 500
    id: home-settings-button
- extendedWaitUntil:
    visible:
      id: settings-menu-active-10
    timeout: 10000
- assertVisible:
    id: settings-menu-account-9
- assertVisible:
    id: settings-menu-account-12
- tapOn:
    waitToSettleTimeoutMs: 500
    id: settings-menu-more-settings
- scrollUntilVisible:
    element:
      id: settings-drafting-unit-verse
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: settings-drafting-unit-pericope
    selected: true
- tapOn:
    waitToSettleTimeoutMs: 500
    id: settings-drafting-unit-verse
- assertVisible:
    id: settings-drafting-unit-verse
    selected: true
- tapOn:
    waitToSettleTimeoutMs: 500
    id: stack-header-back
- assertVisible:
    id: home-tab-my-work
- tapOn:
    waitToSettleTimeoutMs: 500
    id: home-tab-my-work
- scrollUntilVisible:
    element:
      id: ^my-work-row-1183$
    direction: DOWN
    timeout: 30000
    speed: 70
    centerElement: true
- tapOn:
    waitToSettleTimeoutMs: 500
    id: ^my-work-row-1183$
- extendedWaitUntil:
    visible:
      id: drafting-tab-bar
    timeout: 15000
- assertNotVisible:
    id: record-stop-button
- tapOn:
    waitToSettleTimeoutMs: 500
    id: drafting-tab-bible
- scrollUntilVisible:
    element:
      id: ^bible-verse-row-6$
    direction: DOWN
    timeout: 15000
    speed: 70
    centerElement: true
- assertNotVisible:
    id: bible-pericope-unavailable
- tapOn:
    waitToSettleTimeoutMs: 500
    id: ^bible-verse-row-6$
- assertVisible:
    id: record-verse-reference
    text: '^1 Peter 1:6$'
- extendedWaitUntil:
    visible:
      id: source-audio-label
      text: ^WEB Source Audio · Verse 6 / 25$
    timeout: 15000
- assertVisible:
    id: source-audio-paused
- assertNotVisible:
    id: record-stop-button
- takeScreenshot: cached-unit-verse-restored-6
- tapOn:
    waitToSettleTimeoutMs: 500
    id: drafting-header-back
- assertVisible:
    id: home-tab-my-work
