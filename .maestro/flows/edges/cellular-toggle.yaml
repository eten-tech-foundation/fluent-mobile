# Sync screen cellular toggle is present (gate chrome).
appId: com.eten.fluent
tags:
  - smoke
  - sync
  - edges
---
- runFlow: ../../shared/ensure/ensure-warm-home.yaml
- runFlow: ../../shared/nav/goto-sync.yaml
- assertVisible:
    id: 'sync-screen'
- assertVisible:
    id: 'sync-upload-cellular-switch'
# Toggle then restore so the device preference is not left flipped.
- tapOn:
    id: 'sync-upload-cellular-switch'
- tapOn:
    id: 'sync-upload-cellular-switch'
- assertVisible:
    id: 'sync-upload-cellular-switch'
