# Mic deny: reach Record without crash.
appId: com.eten.fluent
tags:
  - edges
  - permissions
---
- runFlow: ../../helpers/launch-android-mic-deny.yaml
- runFlow: ../../helpers/boot-past-dev-launcher.yaml
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 180000
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- assertVisible:
    id: 'passage-header'
- assertVisible:
    id: 'passage-record|passage-listen'
- tapOn:
    id: 'passage-record'
    optional: true
- assertVisible:
    id: 'passage-header'
