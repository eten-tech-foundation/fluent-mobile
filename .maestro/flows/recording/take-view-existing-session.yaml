# Others' takes (Legacy mine/all take-view-toggle → Next Review) — existing
# session only (read-only chrome). Next map: my-work-row-* → home-next-{id}:
# via open-my-work-chapter; take-view-toggle → passage-title →
# passage-open-review (hard, offered only with multiple recorders);
# take-view-all / record-all-take-list → passage-review +
# passage-review-owner-*; take-view-mine → Review closed (Passage shows only
# my takes).
#
# Preconditions (fail visibly if unmet — no optional skip / fake pass):
# - App already running with a logged-in session (not login screen).
# - Home reachable; Next up (or the book page) shows the fixture chapter id.
# - MAESTRO_FIXTURE_CHAPTER_ID: nonempty digits /^[1-9][0-9]*$/ (typeof-safe
#   guard below).
# - EXISTING multi-recorder data on that chapter's current Record unit so
#   passage-open-review is offered (hasMultipleRecorders). If absent → FAIL.
# - MAESTRO_FIXTURE_TAKE_VIEW_ALL_MARKER: required nonempty typeof-safe string;
#   non-sensitive other-recorder label (Review owner name text).
#   Asserted as anchored ^…$ escaped exact text; must not show outside Review.
#
# Forbidden (command nodes — not this comment): clearState, ensure-on-login,
# login-*, ensure-warm-home, ensure-warm-session, Discard, record-start /
# new-take / stop / play / delete, mic launch helpers, sync mutations.
# Distinct from recording/take-view-toggle.yaml (warm-home path).
#
# Tags: record, existing-session, fixture-blocked, multi-recorder. The
# fixture-blocked tag keeps default lanes from running it without the fixture.
#
# Complex selector values use an external runScript. Primitive exports avoid
# the installed engine's undefined inline concat/regex output; guards stay strict.
appId: com.eten.fluent
tags:
  - record
  - existing-session
  - fixture-blocked
  - multi-recorder
---
# Normalize + validate env before any UI (typeof-safe; block scalar for : / regex).
- runScript: ../../shared/scripts/take-view-values.js
- assertTrue: ${typeof output.fixtureChapterId === 'string' && /^[1-9][0-9]*$/.test(output.fixtureChapterId)}
- assertTrue: ${typeof output.takeViewAllMarker === 'string' && output.takeViewAllMarker.length > 0}
- assertTrue: ${typeof output.takeViewAllMarkerRe === 'string' && output.takeViewAllMarkerRe.length > 0 && typeof output.homeNextIdRe === 'string' && output.homeNextIdRe.length > 0}
- assertTrue: ${RegExp(output.takeViewAllMarkerRe).test(output.takeViewAllMarker) === true}
- assertTrue: ${RegExp(output.homeNextIdRe).test('home-next-' + output.fixtureChapterId + ':x') === true}
- assertTrue: ${RegExp(output.takeViewAllMarkerRe).test(output.takeViewAllMarker + 'X') === false && RegExp(output.takeViewAllMarkerRe).test('X' + output.takeViewAllMarker) === false}
- assertTrue: ${RegExp(output.homeNextIdRe).test('home-next-' + output.fixtureChapterId + '0:x') === false}

- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- assertVisible:
    id: 'passage-header'
# Mine (Review closed): fixture marker must not show.
- assertNotVisible:
    id: 'passage-review'
- assertNotVisible:
    text: ${output.takeViewAllMarkerRe}
- tapOn:
    id: 'passage-title'
- extendedWaitUntil:
    visible:
      id: 'passage-title-sheet'
    timeout: 10000
# Hard fail if multi-recorder fixture missing (no when/skip).
- extendedWaitUntil:
    visible:
      id: 'passage-open-review'
    timeout: 20000
- tapOn:
    id: 'passage-open-review'
# All: Review + owner group + non-sensitive marker from fixture.
- extendedWaitUntil:
    visible:
      id: 'passage-review'
    timeout: 15000
- assertVisible:
    id: 'passage-review-owner-.*'
- extendedWaitUntil:
    visible:
      text: ${output.takeViewAllMarkerRe}
    timeout: 15000
# Back to mine: Review gone; marker gone.
- back
- extendedWaitUntil:
    notVisible:
      id: 'passage-review'
    timeout: 10000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- assertNotVisible:
    text: ${output.takeViewAllMarkerRe}
- runFlow: ../../shared/nav/goto-home.yaml
- assertNotVisible:
    id: 'login-email-input'
