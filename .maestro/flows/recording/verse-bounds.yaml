# Verse previous/next chrome present in the Next Passage player.
# Next map: drafting-tab-record → passage-listen (opens the player);
# record-verse-reference → passage-verse-position; record-prev-verse /
# record-next-verse → passage-key-previous / passage-key-next.
appId: com.eten.fluent
tags:
  - smoke
  - record
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- assertVisible:
    id: 'passage-header'
- tapOn:
    id: 'passage-listen'
- extendedWaitUntil:
    visible:
      id: 'passage-player'
    timeout: 15000
- assertVisible:
    id: 'passage-verse-position'
- assertVisible:
    id: 'passage-key-previous'
- assertVisible:
    id: 'passage-key-next'
- tapOn:
    id: 'passage-key-next'
- assertVisible:
    id: 'passage-verse-position'
- tapOn:
    id: 'passage-key-previous'
- assertVisible:
    id: 'passage-verse-position'
