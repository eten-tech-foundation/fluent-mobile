# Verse prev/next chrome present on Record tab.
appId: com.eten.fluent
tags:
  - smoke
  - record
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- assertVisible:
    id: 'record-verse-reference'
- assertVisible:
    id: 'record-prev-verse'
- assertVisible:
    id: 'record-next-verse'
