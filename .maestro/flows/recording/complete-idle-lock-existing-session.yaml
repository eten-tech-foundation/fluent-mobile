# READ-ONLY Complete-stage idle lock subset (B-0014-01 / #717).
# Known authorized fixture: user10, project8 / unit11, Milestone Testing 2,
# chapter assignment487 = 2 Peter3, statuscomplete, no cached takes.
# Root verifies the cached account and fixture data before execution.
# Required env pins ALL fixture selectors; missing/wrong values fail before UI:
# MAESTRO_FIXTURE_PROJECT_NAME='Milestone Testing 2'
# MAESTRO_FIXTURE_CHAPTER_LABEL='2 Peter 3'
# MAESTRO_EXPECT_COMPLETE_IDLE_FIXTURE='487'
# Never tap capture/play/claim/stage or change auth, data or preferences.
# This proves idle controls only, not populated Review or native playback.
appId: com.eten.fluent
tags:
  - recording
  - existing-session
  - read-only
  - guard
  - fixture-blocked
---
- runScript: ../../shared/scripts/ownership-status-values.js
- assertTrue: ${output.fixtureProjectName === 'Milestone Testing 2'}
- assertTrue: ${output.fixtureChapterLabel === '2 Peter 3'}
- assertTrue: ${typeof MAESTRO_EXPECT_COMPLETE_IDLE_FIXTURE !== 'undefined' && String(MAESTRO_EXPECT_COMPLETE_IDLE_FIXTURE).trim() === '487'}
- assertTrue: ${typeof output.projectNameRe === 'string' && output.projectNameRe.length > 0}
- assertTrue: ${typeof output.chapterLabelRe === 'string' && output.chapterLabelRe.length > 0}
- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/goto-home.yaml
- assertVisible:
    id: 'home-tab-my-work'
- tapOn:
    id: 'home-tab-projects'
- extendedWaitUntil:
    visible:
      id: 'milestone-row-.*'
    timeout: 30000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- scrollUntilVisible:
    element:
      text: ${output.projectNameRe}
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ${output.projectNameRe}
- extendedWaitUntil:
    visible:
      id: 'chapter-row-.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'chapter-row-487'
    direction: DOWN
    timeout: 30000
# Guard actual selected chapter and stage, not only an env declaration.
- assertVisible:
    id: 'chapter-row-487'
    containsDescendants:
      - text: ${output.chapterLabelRe}
      - text: '^Complete$'
- tapOn:
    id: 'chapter-row-487'
- extendedWaitUntil:
    visible:
      id: 'drafting-tab-bar'
    timeout: 30000
# Stop before Record if the previously observed HTTP error UI recurs.
- assertNotVisible:
    text: '^Console Error$'
- assertNotVisible:
    text: '^.*\[HTTP\].*API error.*$'
- tapOn:
    id: 'drafting-tab-record'
- extendedWaitUntil:
    visible:
      id: 'record-tab'
    timeout: 30000
- assertVisible:
    id: 'record-tab'
- assertVisible:
    id: 'record-verse-reference'
# A missing source text can also disable recording; reject that false positive.
- assertNotVisible:
    id: 'record-syncing-hint'
- assertVisible:
    id: 'record-start-button'
    enabled: false
- assertVisible:
    id: 'record-play-idle-placeholder'
    enabled: false
- assertNotVisible:
    id: 'record-new-take-button'
- assertNotVisible:
    id: 'record-take-list'
- assertNotVisible:
    id: 'record-all-take-list'
- assertNotVisible:
    id: 'record-stop-button'
- assertNotVisible:
    id: 'record-pause-button'
- assertNotVisible:
    id: 'record-resume-button'
- assertNotVisible:
    id: 'record-duration'
- tapOn:
    id: 'drafting-header-back'
- extendedWaitUntil:
    visible:
      id: 'chapter-row-487'
    timeout: 30000
- assertVisible:
    id: 'stack-header-back'
- tapOn:
    id: 'stack-header-back'
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
