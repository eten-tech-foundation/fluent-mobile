# Record → stop → play → delete (mic pre-granted). Cleans up the take created.
appId: com.eten.fluent
tags:
  - record
  - mutating
---
- runFlow: ../../helpers/launch-android-mic-warm.yaml
- runFlow: ../../shared/ensure/ensure-warm-session.yaml
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- assertVisible:
    id: 'record-tab'
- runFlow: ../../shared/ensure/ensure-take-capacity.yaml
- runFlow:
    when:
      visible:
        id: 'record-start-button'
        enabled: true
    commands:
      - tapOn:
          id: 'record-start-button'
- runFlow:
    when:
      visible:
        id: 'record-new-take-button'
        enabled: true
    commands:
      - tapOn:
          id: 'record-new-take-button'
- extendedWaitUntil:
    visible:
      id: 'record-stop-button'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'record-duration'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'record-stop-button'
- extendedWaitUntil:
    visible:
      id: 'record-play-button-.*'
    timeout: 30000
- tapOn:
    id: 'record-play-button-.*'
- extendedWaitUntil:
    visible: 'Pause draft'
    timeout: 10000
- tapOn:
    id: 'record-delete-selected-button-.*'
- tapOn:
    text: 'Delete'
- extendedWaitUntil:
    notVisible:
      id: 'record-delete-selected-button-.*'
    timeout: 15000
