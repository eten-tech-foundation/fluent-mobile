# Take view toggle chrome when multiple recorders are present (optional).
appId: com.eten.fluent
# Requires a chapter with more than one recorder. Not in smoke until that fixture exists.
tags:
  - record
  - multi-recorder
---
- runFlow: ../../shared/ensure/ensure-warm-home.yaml
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- extendedWaitUntil:
    visible:
      id: 'take-view-toggle'
    timeout: 20000
- tapOn:
    id: 'take-view-all'
- assertVisible:
    id: 'record-all-take-list'
- tapOn:
    id: 'take-view-mine'
- assertVisible:
    id: 'record-take-list'
