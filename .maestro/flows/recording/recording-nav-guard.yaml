# Recording nav guard: back while recording raises alert and stays on Record.
# Mutating: requires MAESTRO_FIXTURE_CHAPTER_ID on an allowlisted project.
# fixture-blocked keeps default lanes from running this without that fixture.
appId: com.eten.fluent
tags:
  - edges
  - record
  - mutating
  - fixture-blocked
---
- runFlow: ../../helpers/launch-android-mic-allow.yaml
- runFlow: ../../helpers/boot-past-dev-launcher.yaml
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 180000
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- runFlow: ../../shared/ensure/ensure-take-capacity.yaml
- runFlow:
    when:
      visible:
        id: 'record-start-button'
        enabled: true
    commands:
      - tapOn:
          id: 'record-start-button'
- runFlow:
    when:
      visible:
        id: 'record-new-take-button'
        enabled: true
    commands:
      - tapOn:
          id: 'record-new-take-button'
- extendedWaitUntil:
    visible:
      id: 'record-stop-button'
    timeout: 15000
- tapOn:
    id: 'drafting-header-back'
- extendedWaitUntil:
    visible: 'Recording in progress'
    timeout: 10000
- tapOn: 'Resume'
- assertVisible:
    id: 'record-stop-button'
- tapOn:
    id: 'drafting-header-back'
- extendedWaitUntil:
    visible: 'Recording in progress'
    timeout: 10000
- tapOn: 'Discard'
- extendedWaitUntil:
    notVisible:
      id: 'record-stop-button'
    timeout: 15000
