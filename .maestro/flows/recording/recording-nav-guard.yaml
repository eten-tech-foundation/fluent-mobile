# Recording leave guard on Next Passage: a live take + leave asks
# "Recording in progress"; Resume cancels the leave and keeps recording;
# leave again and Discard ends the take and closes the player.
# Mutating: requires MAESTRO_FIXTURE_CHAPTER_ID on an allowlisted project.
# fixture-blocked keeps default lanes from running this without that fixture.
# Next map: drafting-header-back → Sheet.close() (system Back). Close in the
# hero is the same handler, but it sits in a GestureDetector; Maestro's tap
# on passage-close does not fire onPress (device 2026-11-25). Both prompts
# use Back. record-start → passage-record + passage-key-record; live key →
# 'Pause recording'. Dialog actions: passage-confirm-cancel / -confirm.
appId: com.eten.fluent
tags:
  - edges
  - record
  - mutating
  - fixture-blocked
---
- runFlow: ../../helpers/launch-android-mic-allow.yaml
- runFlow: ../../helpers/boot-past-dev-launcher.yaml
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 180000
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- assertVisible:
    id: 'passage-header'
- runFlow: ../../shared/ensure/ensure-take-capacity.yaml
- tapOn:
    id: 'passage-record'
- extendedWaitUntil:
    visible:
      id: 'passage-player'
    timeout: 15000
- tapOn:
    id: 'passage-key-record'
- extendedWaitUntil:
    visible: 'Pause recording'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
# Cancelled navigation: Back asks, Resume keeps the live take.
- back
- extendedWaitUntil:
    visible:
      id: 'passage-confirm'
    timeout: 10000
- assertVisible: 'Recording in progress'
- tapOn:
    id: 'passage-confirm-cancel'
- extendedWaitUntil:
    notVisible:
      id: 'passage-confirm'
    timeout: 10000
- assertVisible:
    id: 'passage-player'
- assertVisible: 'Pause recording'
# Leave again; Discard ends the take and closes the player.
- back
- extendedWaitUntil:
    visible:
      id: 'passage-confirm'
    timeout: 10000
- tapOn:
    id: 'passage-confirm-confirm'
- extendedWaitUntil:
    notVisible: 'Pause recording'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'passage-record'
    timeout: 15000
- assertVisible:
    id: 'passage-header'
