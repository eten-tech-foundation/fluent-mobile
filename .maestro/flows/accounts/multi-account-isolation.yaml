# Multi-account isolation — nightly checklist A–D.
# Account A = translator shape (MAESTRO_EMAIL). Account B = member-without-assignments (MAESTRO_EMAIL_2).
appId: com.eten.fluent
tags:
  - multi-account
  - accounts
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/sync-now-and-return.yaml

- extendedWaitUntil:
    visible:
      id: 'home-next-[0-9]+:.*|home-book-.*'
    timeout: 60000
# Next lists Books above Next up — scroll past the gallery to copy the card.
- scrollUntilVisible:
    element:
      id: 'home-next-[0-9]+:.*'
    direction: DOWN
    timeout: 20000
- copyTextFrom:
    id: 'home-next-[0-9]+:.*'
- evalScript: ${output.accountAMyWorkLabel = maestro.copiedText}
- assertTrue: ${output.accountAMyWorkLabel != null && output.accountAMyWorkLabel != ''}

# A2: Add User → Account B
- runFlow: ../../shared/nav/open-drawer.yaml
- tapOn:
    id: 'home-accounts-add'
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 30000
- runFlow: ../../shared/auth/login-account-b.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/sync-now-and-return.yaml

# A1–A2: both accounts listed
- runFlow: ../../shared/nav/open-drawer.yaml
- assertVisible: ${MAESTRO_EMAIL}
- assertVisible: ${MAESTRO_EMAIL_2}
- assertVisible:
    id: 'home-account-.*'
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 15000

# B: switch B → A, then A → B
- runFlow: ../../shared/nav/open-drawer.yaml
- tapOn: ${MAESTRO_EMAIL}
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/goto-settings.yaml
- scrollUntilVisible:
    element:
      id: 'settings-log-out'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: 'settings-log-out'
- back
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 30000

- runFlow: ../../shared/nav/open-drawer.yaml
- tapOn: ${MAESTRO_EMAIL_2}
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml

# C1: Account B Home settled. B may have its own Next up — do not require
# home-empty. A's copied card must not appear in B's Next-up section.
- runFlow: ../../shared/ensure/ensure-home-settled.yaml
- scrollUntilVisible:
    element:
      id: 'home-next-up-hero|home-next-up-empty|home-next-[0-9]+:.*'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- assertNotVisible: ${output.accountAMyWorkLabel}

# C3: switch to A — label returns
- runFlow: ../../shared/nav/open-drawer.yaml
- tapOn: ${MAESTRO_EMAIL}
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- extendedWaitUntil:
    visible:
      id: 'home-next-[0-9]+:.*|home-book-.*'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'home-next-[0-9]+:.*'
    direction: DOWN
    timeout: 20000
- assertVisible: ${output.accountAMyWorkLabel}

# D: sync on active user
- runFlow: ../../shared/nav/sync-now-and-return.yaml
