# Prepare Offline manage-device-storage section chrome (when present after project pick).
appId: com.eten.fluent
tags:
  - offline
  - sync
---
- runFlow: ../../shared/ensure/ensure-warm-home.yaml
- runFlow: ../../shared/nav/goto-settings.yaml
- scrollUntilVisible:
    element:
      id: 'settings-prepare-offline'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'settings-prepare-offline'
- extendedWaitUntil:
    visible:
      id: 'prepare-offline-screen'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'project-row-.*'
    timeout: 30000
- tapOn:
    id: 'project-row-.*'
- extendedWaitUntil:
    visible:
      id: 'prepare-offline-resources-section'
    timeout: 60000
- assertVisible:
    id: 'manage-device-storage-section'
- assertVisible:
    id: 'storage-available-bytes'
