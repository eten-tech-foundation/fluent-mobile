# Prepare Offline manage-device-storage section chrome (when present after project pick).
appId: com.eten.fluent
tags:
  - offline
  - sync
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/goto-settings.yaml
- scrollUntilVisible:
    element:
      id: 'settings-prepare-offline'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'settings-prepare-offline'
- extendedWaitUntil:
    visible:
      id: 'prepare-offline-screen'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'project-row-.*'
    commands:
      - tapOn:
          id: 'project-row-.*'
- extendedWaitUntil:
    visible:
      id: 'prepare-offline-resources-section'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'storage-project-.*'
    commands:
      - assertVisible:
          id: 'storage-project-.*'
