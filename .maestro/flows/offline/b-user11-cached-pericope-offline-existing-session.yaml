# Offline cached whole-pericope state variant; not new atomic count by default.
# Driver guards cached Bible34844/45, download rows0, modePericope, radio approval.
# After CLI, native UI word-stream attestation proves FULL two-verse contents.
# Driver finally restores original radios, Verse, Home/11; no writes to fixtures.
appId: com.eten.fluent
tags: [offline, existing-session, read-only, guard]
---
- assertTrue: ${typeof MAESTRO_B_USER_ID !== 'undefined' && MAESTRO_B_USER_ID === '11' && typeof MAESTRO_B_SERIAL !== 'undefined' && MAESTRO_B_SERIAL === 'emulator-5556' && typeof MAESTRO_B_PROJECT12_DOWNLOAD_ROWS !== 'undefined' && MAESTRO_B_PROJECT12_DOWNLOAD_ROWS === '0'}
- assertVisible:
    id: '^home-tab-projects$'
- extendedWaitUntil:
    visible:
      id: '^home-sync-button$'
      text: '^Offline.*$'
    timeout: 20000
- tapOn:
    id: '^milestone-row-19$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^chapter-row-1183$'
    timeout: 15000
- tapOn:
    id: '^chapter-row-1183$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^drafting-tab-bible$'
    timeout: 15000
- tapOn:
    id: '^drafting-tab-bible$'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: '^bible-pericope-pericope:1:1$'
    timeout: 15000
- assertNotVisible:
    id: '^bible-pericope-verse-1-1$'
- tapOn:
    id: '^bible-pericope-expand-pericope:1:1$'
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: '^bible-pericope-verse-1-1$'
- assertVisible:
    id: '^bible-pericope-verse-1-2$'
- assertNotVisible:
    id: '^bible-tab-loading$'
- extendedWaitUntil:
    visible:
      id: '^source-audio-label$'
      text: '^No source audio$'
    timeout: 20000
- assertNotVisible:
    id: '^source-audio-loading$'
- assertNotVisible:
    id: '^source-audio-play$'
- assertNotVisible:
    id: '^source-audio-pause$'
- takeScreenshot: b-offline-pericope-cached-both-verses-no-source
- tapOn:
    id: '^drafting-tab-resources$'
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: '^resources-unit-1183-pericope:1:1$'
- assertVisible: '^1 Peter 1:1–2$'
- assertVisible: '^No resources are on this device yet\. Download them from Prepare for Offline\.$'
- assertNotVisible:
    id: '^resources-tab-loading$'
- assertNotVisible:
    id: '^resources-section-translationNotes-toggle$'
- assertNotVisible:
    id: '^resources-section-translationQuestions-toggle$'
- assertNotVisible:
    id: '^resources-section-imagesMaps-toggle$'
- takeScreenshot: b-offline-pericope-resources-no-local-payload-guidance
- tapOn:
    id: '^drafting-tab-record$'
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: '^record-verse-reference$'
    text: '^1 Peter 1:1–2$'
- assertNotVisible:
    id: '^record-pericope-unavailable$'
- assertNotVisible:
    id: '^record-stop-button$'
- takeScreenshot: b-offline-pericope-record-range-no-capture
- tapOn:
    id: '^drafting-tab-bible$'
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: '^bible-pericope-verse-1-1$'
- assertVisible:
    id: '^bible-pericope-verse-1-2$'
- takeScreenshot: b-offline-pericope-final-native-text-attestation-state
