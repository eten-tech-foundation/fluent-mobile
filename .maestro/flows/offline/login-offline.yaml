# Offline login from a signed-out screen: airplane mode → submit → connection error.
# ensure-on-login reaches login with no stored session, so there is no password
# verifier to accept. A successful offline sign-in (#1001) needs a prior online
# sign-in that saved the verifier and left the token on the device.
# Requires scripts/maestro-adb-network.sh offline before this flow (shell wrapper).
# Tagged offline — excluded from default smoke runs.
appId: com.eten.fluent
tags:
  - offline
  - edges
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- tapOn:
    id: 'login-email-input'
- eraseText
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: 'login-password-input'
- eraseText
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: 'login-submit-button'
- extendedWaitUntil:
    visible:
      id: 'login-global-error'
    timeout: 60000
- assertVisible:
    id: 'login-email-input'
