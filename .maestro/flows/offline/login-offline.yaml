# Offline login from a signed-out screen: airplane mode → submit → connection error.
# Wrapper boots to login WHILE ONLINE (Metro cannot load JS in airplane), then
# enables airplane, then this flow. No ensure-on-login / clearState here.
# A successful offline sign-in (#1001) needs a prior online sign-in that saved
# the verifier and left the token on the device.
# Requires scripts/maestro-test-offline-login.sh (not a bare maestro run).
# Tagged offline — excluded from default smoke runs.
appId: com.eten.fluent
tags:
  - offline
  - edges
---
- launchApp:
    stopApp: false
    clearState: false
- assertVisible:
    id: 'login-email-input'
- tapOn:
    id: 'login-email-input'
- eraseText
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: 'login-password-input'
- eraseText
- inputText: ${MAESTRO_PASSWORD}
# Do not hideKeyboard: Android BACK backgrounds the app (same as login-validation).
- tapOn:
    id: 'login-submit-button'
- extendedWaitUntil:
    visible:
      id: 'login-global-error'
    timeout: 60000
- assertVisible:
    id: 'login-email-input'
