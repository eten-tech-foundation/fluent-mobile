# B peer11 settings reachability/rendering only: no preference taps or writes.
appId: com.eten.fluent
tags:
  - settings
  - existing-session
  - read-only
  - guard
---
- assertTrue: ${typeof MAESTRO_B_USER_ID !== 'undefined' && MAESTRO_B_USER_ID === '11' && typeof MAESTRO_B_SERIAL !== 'undefined' && MAESTRO_B_SERIAL === 'emulator-5556'}
- assertNotVisible:
    id: '^login-email-input$'
- assertVisible:
    id: '^home-settings-button$'
- tapOn:
    id: '^home-settings-button$'
- extendedWaitUntil:
    visible:
      id: '^settings-menu-active-11$'
    timeout: 15000
- assertVisible:
    id: '^settings-menu-account-11$'
    text: '^Switch to qa\+fluentqa-translator2@fluent\.local$'
- tapOn:
    id: '^settings-menu-more-settings$'
- extendedWaitUntil:
    visible:
      id: '^settings-ui-version$'
    timeout: 15000
- assertVisible:
    text: '^Settings$'
- assertVisible:
    id: '^settings-ui-version$'
- scrollUntilVisible:
    element:
      id: '^settings-drafting-unit$'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: '^settings-upload-cellular$'
- assertVisible:
    id: '^settings-drafting-unit$'
- assertNotVisible:
    id: '^settings-reauth$'
- takeScreenshot: b-peer11-settings-readonly
- tapOn:
    id: '^stack-header-back$'
- extendedWaitUntil:
    visible:
      id: '^home-tab-projects$'
    timeout: 15000
- assertNotVisible:
    id: '^login-email-input$'
