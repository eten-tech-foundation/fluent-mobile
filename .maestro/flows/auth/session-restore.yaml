# Session restore: relaunch without clearState → Home, no login screen.
appId: com.eten.fluent
tags:
  - smoke
  - auth
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- stopApp
- launchApp
# Metro mode: re-open deep-link (clearState wiped most-recent; relaunch may still need it)
- runFlow: ../../helpers/open-metro-deeplink.yaml
- runFlow: ../../helpers/boot-past-dev-launcher.yaml
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- assertNotVisible:
    id: 'login-email-input'
- assertVisible:
    id: 'home-tab-projects'
