# Logout from Settings → lands on login.
appId: com.eten.fluent
tags:
  - smoke
  - auth
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/auth/logout.yaml
- assertVisible:
    id: 'login-email-input'
