# Logged-out login form: empty and invalid-email local validation.
# Requires a freshly installed/logged-out device: the caller sets
# MAESTRO_LOGGED_OUT_FRESH_STATE=true, MAESTRO_KNOWN_ACCOUNT_COUNT=0 and
# MAESTRO_VALIDATION_SERIAL=<adb serial of the target device>.
# No launch/reset/logout/auth helper; no authentication request is made.
appId: com.eten.fluent
tags:
  - auth
  - existing-session
  - local-validation
  - fixture-blocked
---
- assertTrue: ${typeof MAESTRO_LOGGED_OUT_FRESH_STATE !== 'undefined' && MAESTRO_LOGGED_OUT_FRESH_STATE === 'true'}
- assertTrue: ${typeof MAESTRO_KNOWN_ACCOUNT_COUNT !== 'undefined' && MAESTRO_KNOWN_ACCOUNT_COUNT === '0'}
- assertTrue: ${typeof MAESTRO_VALIDATION_SERIAL !== 'undefined' && String(MAESTRO_VALIDATION_SERIAL).length > 0}
- assertVisible:
    text: '^Log in to continue to Fluent\.$'
- assertVisible:
    id: '^login-email-input$'
- assertVisible:
    id: '^login-password-input$'
    text: '^Password\*$'
- assertVisible:
    id: '^login-submit-button$'
- assertNotVisible:
    id: '^home-tab-my-work$'
- tapOn:
    id: '^login-email-input$'
- eraseText
- hideKeyboard
- assertVisible:
    id: '^login-email-input$'
    text: '^Email address\*$'
- tapOn:
    id: '^login-submit-button$'
- assertVisible:
    text: '^Please enter an email address$'
- assertVisible:
    text: '^Password is required$'
- takeScreenshot: loggedout-empty-validation
- tapOn:
    id: '^login-email-input$'
- inputText: invalid
- hideKeyboard
- assertVisible:
    id: '^login-password-input$'
    text: '^Password\*$'
- tapOn:
    id: '^login-submit-button$'
- assertVisible:
    text: '^Please enter a valid email address$'
- assertVisible:
    text: '^Password is required$'
- assertVisible:
    id: '^login-email-input$'
    text: '^invalid$'
- assertNotVisible:
    id: '^home-tab-my-work$'
- takeScreenshot: loggedout-invalid-email-validation
