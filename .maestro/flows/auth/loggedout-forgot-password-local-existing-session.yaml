# Logged-out forgot-password: navigation and local email validation.
# Requires a freshly installed/logged-out device: the caller sets
# MAESTRO_LOGGED_OUT_FRESH_STATE=true, MAESTRO_KNOWN_ACCOUNT_COUNT=0 and
# MAESTRO_VALIDATION_SERIAL=<adb serial of the target device>.
# No launch/reset/logout/auth helper; no authentication request is made.
appId: com.eten.fluent
tags:
  - auth
  - existing-session
  - local-validation
  - fixture-blocked
---
- assertTrue: ${typeof MAESTRO_LOGGED_OUT_FRESH_STATE !== 'undefined' && MAESTRO_LOGGED_OUT_FRESH_STATE === 'true'}
- assertTrue: ${typeof MAESTRO_KNOWN_ACCOUNT_COUNT !== 'undefined' && MAESTRO_KNOWN_ACCOUNT_COUNT === '0'}
- assertTrue: ${typeof MAESTRO_VALIDATION_SERIAL !== 'undefined' && String(MAESTRO_VALIDATION_SERIAL).length > 0}
- assertVisible:
    id: '^login-email-input$'
- assertVisible:
    id: '^login-password-input$'
    text: '^Password\*$'
- assertVisible:
    text: '^Log in to continue to Fluent\.$'
- assertNotVisible:
    id: '^home-tab-my-work$'
- tapOn:
    id: '^login-forgot-password-link$'
- extendedWaitUntil:
    visible:
      id: '^forgot-password-email-input$'
    timeout: 15000
- assertVisible:
    text: '^Forgot Your Password\?$'
- assertVisible:
    text: '^Enter your email address to reset your password\.$'
- assertVisible:
    id: '^forgot-password-submit-button$'
- assertVisible:
    id: '^forgot-password-back-link$'
- tapOn:
    id: '^forgot-password-email-input$'
- eraseText
- hideKeyboard
- assertVisible:
    id: '^forgot-password-email-input$'
    text: '^Email address\*$'
- tapOn:
    id: '^forgot-password-submit-button$'
- assertVisible:
    text: '^Please enter an email address$'
- assertNotVisible:
    id: '^forgot-password-sent-view$'
- takeScreenshot: forgot-password-empty-local-validation
- tapOn:
    id: '^forgot-password-email-input$'
- inputText: invalid
- hideKeyboard
- assertVisible:
    id: '^forgot-password-email-input$'
    text: '^invalid$'
- tapOn:
    id: '^forgot-password-submit-button$'
- assertVisible:
    text: '^Please enter a valid email address$'
- assertNotVisible:
    id: '^forgot-password-sent-view$'
- takeScreenshot: forgot-password-invalid-local-validation
- tapOn:
    id: '^forgot-password-back-link$'
- extendedWaitUntil:
    visible:
      id: '^login-email-input$'
    timeout: 15000
- assertVisible:
    text: '^Log in to continue to Fluent\.$'
- assertVisible:
    id: '^login-password-input$'
    text: '^Password\*$'
- assertVisible:
    id: '^login-submit-button$'
- assertNotVisible:
    id: '^home-tab-my-work$'
- takeScreenshot: forgot-password-return-login
