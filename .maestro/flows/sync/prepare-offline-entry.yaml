# Prepare for Offline entry via Settings → project picker → resources chrome.
appId: com.eten.fluent
tags:
  - smoke
  - sync
  - offline
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/goto-settings.yaml
- scrollUntilVisible:
    element:
      id: 'settings-prepare-offline'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'settings-prepare-offline'
- extendedWaitUntil:
    visible:
      id: 'prepare-offline-screen'
    timeout: 30000
# The first project row can have an empty catalog. That hides
# prepare-offline-resources-section. Open the fixture project.
- assertTrue: ${typeof MAESTRO_FIXTURE_PROJECT_ID !== 'undefined' && /^[1-9][0-9]*$/.test(String(MAESTRO_FIXTURE_PROJECT_ID))}
- scrollUntilVisible:
    element:
      id: '^project-row-${MAESTRO_FIXTURE_PROJECT_ID}$'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- tapOn:
    id: '^project-row-${MAESTRO_FIXTURE_PROJECT_ID}$'
- extendedWaitUntil:
    visible:
      id: 'prepare-offline-resources-section'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'prepare-offline-download-footer'
    timeout: 60000
