# Record a take, Sync Now, assert Sync screen settles (upload path).
appId: com.eten.fluent
tags:
  - smoke
  - sync
  - record
---
- runFlow: ../../helpers/launch-android-mic-allow.yaml
- runFlow: ../../helpers/boot-past-dev-launcher.yaml
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 180000
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- runFlow: ../../shared/nav/open-any-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- runFlow: ../../shared/ensure/ensure-take-capacity.yaml
- runFlow:
    when:
      visible:
        id: 'record-start-button'
        enabled: true
    commands:
      - tapOn:
          id: 'record-start-button'
- runFlow:
    when:
      visible:
        id: 'record-new-take-button'
        enabled: true
    commands:
      - tapOn:
          id: 'record-new-take-button'
- extendedWaitUntil:
    visible:
      id: 'record-stop-button'
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: 'record-stop-button'
- extendedWaitUntil:
    visible:
      id: 'record-play-button-.*'
    timeout: 30000
- tapOn:
    id: 'drafting-header-back'
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 30000
- runFlow: ../../shared/nav/sync-now-and-return.yaml
- assertVisible:
    id: 'home-tab-my-work'
# Cleanup: reopen chapter and delete the take we created when still present
- runFlow: ../../shared/nav/open-any-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- runFlow:
    when:
      visible:
        id: 'record-delete-selected-button-.*'
    commands:
      - tapOn:
          id: 'record-delete-selected-button-.*'
      - tapOn:
          text: 'Delete'
