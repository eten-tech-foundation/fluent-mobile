# Record a take, open Sync, wait until the upload path settles.
# Next auto-starts the upload after eject, so Sync Now is often already gone
# ("Online · all synced"). If it is still offered, tap it. Do not skip-green
# by dropping the settled asserts.
# Mutating: requires MAESTRO_FIXTURE_CHAPTER_ID on an allowlisted project.
# fixture-blocked keeps default lanes from running this without that fixture.
# Next map: drafting-tab-record / record-start → passage-record +
# passage-key-record; stop → passage-key-eject.
appId: com.eten.fluent
tags:
  - sync
  - record
  - mutating
  - fixture-blocked
---
- runFlow: ../../helpers/launch-android-mic-allow.yaml
- runFlow: ../../helpers/boot-past-dev-launcher.yaml
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 180000
- runFlow: ../../shared/auth/login-translator.yaml
- runFlow: ../../shared/ensure/ensure-home-settled.yaml
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- assertVisible:
    id: 'passage-header'
- runFlow: ../../shared/ensure/ensure-take-capacity.yaml
- tapOn:
    id: 'passage-record'
- extendedWaitUntil:
    visible:
      id: 'passage-key-record'
    timeout: 15000
- tapOn:
    id: 'passage-key-record'
- waitForAnimationToEnd
- tapOn:
    id: 'passage-key-eject'
- extendedWaitUntil:
    visible:
      id: 'passage-key-play|passage-fan-[0-9]+'
    timeout: 30000
- runFlow: ../../shared/nav/goto-home.yaml
- runFlow: ../../shared/nav/goto-sync.yaml
- runFlow:
    when:
      visible:
        id: 'sync-action-sync-now'
    commands:
      - tapOn:
          id: 'sync-action-sync-now'
      - extendedWaitUntil:
          visible:
            id: 'sync-action-controls-syncing'
          timeout: 5000
          optional: true
- extendedWaitUntil:
    notVisible:
      id: 'sync-action-controls-syncing'
    timeout: 180000
- assertNotVisible:
    id: 'sync-action-sync-now'
- assertNotVisible:
    id: 'sync-metadata-error'
- assertNotVisible:
    id: 'sync-retry-error'
- assertVisible:
    id: 'sync-screen'
