# Record a take, Sync Now, assert Sync screen settles (upload path).
appId: com.eten.fluent
tags:
  - sync
  - record
  - mutating
---
- runFlow: ../../helpers/launch-android-mic-warm.yaml
- runFlow: ../../shared/ensure/ensure-warm-session.yaml
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- runFlow: ../../shared/ensure/ensure-take-capacity.yaml
- runFlow:
    when:
      visible:
        id: 'record-start-button'
        enabled: true
    commands:
      - tapOn:
          id: 'record-start-button'
- runFlow:
    when:
      visible:
        id: 'record-new-take-button'
        enabled: true
    commands:
      - tapOn:
          id: 'record-new-take-button'
- extendedWaitUntil:
    visible:
      id: 'record-stop-button'
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: 'record-stop-button'
- extendedWaitUntil:
    visible:
      id: 'record-play-button-.*'
    timeout: 30000
- tapOn:
    id: 'drafting-header-back'
- runFlow: ../../shared/nav/goto-home.yaml
# Require pending upload chrome before sync-now-and-return (helper's sync-now tap is optional)
- runFlow: ../../shared/nav/goto-sync.yaml
- extendedWaitUntil:
    visible:
      id: 'sync-action-sync-now'
    timeout: 60000
- runFlow: ../../shared/nav/sync-now-and-return.yaml
- runFlow: ../../shared/nav/goto-sync.yaml
- assertNotVisible:
    id: 'sync-action-sync-now'
- assertNotVisible:
    id: 'sync-metadata-error'
- runFlow: ../../shared/nav/open-my-work-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- tapOn:
    id: 'record-delete-selected-button-.*'
- tapOn:
    text: 'Delete'
- extendedWaitUntil:
    notVisible:
      id: 'record-delete-selected-button-.*'
    timeout: 15000
