# Sign in with MAESTRO_EMAIL / MAESTRO_PASSWORD (shell env or maestro -e).
# Assumes login screen is already visible.
appId: com.eten.fluent
---
- tapOn:
    id: 'login-email-input'
- eraseText
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: 'login-password-input'
- eraseText
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: 'login-submit-button'
