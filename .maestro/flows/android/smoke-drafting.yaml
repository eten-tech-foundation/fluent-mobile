# Bible unit tap opens Record (shell contract #47 / #564).
# Asserts onOpenRecord without an extra drafting-tab-record tap.
# Requires: Maestro translator with ≥1 My Work assignment; first chapter in
# verse drafting unit with ≥2 verses (not pericope mode).
appId: com.eten.fluent
tags:
  - smoke
  - drafting
---
- runFlow: subflows/boot-to-login.yaml
- runFlow: subflows/login.yaml
- runFlow: subflows/wait-for-home.yaml
- runFlow: subflows/open-first-my-work-chapter.yaml
- tapOn:
    id: 'drafting-tab-bible'
- assertVisible:
    id: 'bible-tab'
# Unit press must open Record without tapping drafting-tab-record
- tapOn:
    id: 'bible-verse-2'
- assertVisible:
    id: 'record-tab'
