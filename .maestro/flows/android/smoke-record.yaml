# Record happy path: mic allow → record → stop → play.
# Does NOT tap stage-advance (destructive on shared dev). Needs ≥1 assignment.
# Start vs new-take: idle-no-takes shows record-start-button; existing takes show
# record-new-take-button (common after sync / prior smoke runs). Chapter must be
# under the 5-take cap or neither control appears (residual — see maestro.md).
appId: com.eten.fluent
tags:
  - smoke
  - record
---
- launchApp:
    clearState: true
    permissions:
      microphone: allow
      notifications: allow
- runFlow: ../../helpers/dismiss-expo-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 60000
- runFlow: subflows/login.yaml
- runFlow: subflows/wait-for-home.yaml
- runFlow: subflows/open-first-my-work-chapter.yaml
- tapOn:
    id: 'drafting-tab-record'
- assertVisible:
    id: 'record-tab'
- runFlow:
    when:
      visible:
        id: 'record-start-button'
    commands:
      - tapOn:
          id: 'record-start-button'
- runFlow:
    when:
      visible:
        id: 'record-new-take-button'
    commands:
      - tapOn:
          id: 'record-new-take-button'
- extendedWaitUntil:
    visible:
      id: 'record-stop-button'
    timeout: 15000
# Short capture so stop is deterministic
- waitForAnimationToEnd
- tapOn:
    id: 'record-stop-button'
- extendedWaitUntil:
    visible:
      id: 'record-play-button'
    timeout: 30000
- tapOn:
    id: 'record-play-button'
- assertVisible:
    id: 'record-tab'
# Explicitly avoid stage-advance-button on shared Maestro accounts
