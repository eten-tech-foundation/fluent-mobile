# My Work → fixture chapter → drafting tab bar — existing session only.
#
# Preconditions (fail visibly if unmet — no skip/auth fallback):
# - App already running with a logged-in session (not login screen).
# - Home reachable; My Work contains the exact fixture chapter row.
# - MAESTRO_FIXTURE_CHAPTER_ID: required string digits /^[1-9][0-9]*$/
#   (typeof-safe assertTrue; anchored ^my-work-row-<id>$ selector).
#
# Complex myWorkRowIdRe: external runScript only (installed Maestro 2.10 leaves
# inline concat/regex evalScript output undefined).
#
# Forbidden: clearState, ensure-on-login, login-*, ensure-warm-home,
# ensure-warm-session, Discard recovered-recording, cold launch wipe.
# Distinct from navigation/my-work-to-drafting.yaml (warm-home path).
appId: com.eten.fluent
tags:
  - nav
  - existing-session
---
- evalScript: >-
    ${output.fixtureChapterId = (typeof MAESTRO_FIXTURE_CHAPTER_ID === 'undefined' || MAESTRO_FIXTURE_CHAPTER_ID === null) ? '' : String(MAESTRO_FIXTURE_CHAPTER_ID).trim()}
- assertTrue: ${typeof output.fixtureChapterId === 'string' && /^[1-9][0-9]*$/.test(output.fixtureChapterId)}
- runScript: ../../shared/scripts/fixture-row-values.js
- assertTrue: ${typeof output.myWorkRowIdRe === 'string' && output.myWorkRowIdRe.length > 0}
- assertTrue: ${RegExp(output.myWorkRowIdRe).test('my-work-row-' + output.fixtureChapterId) === true}
- assertTrue: ${RegExp(output.myWorkRowIdRe).test('my-work-row-' + output.fixtureChapterId + '0') === false && RegExp(output.myWorkRowIdRe).test('my-work-row-0' + output.fixtureChapterId) === false}
- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/goto-home.yaml
- assertVisible:
    id: 'home-tab-my-work'
- tapOn:
    id: 'home-tab-my-work'
- scrollUntilVisible:
    element:
      id: ${output.myWorkRowIdRe}
    direction: DOWN
    timeout: 30000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- tapOn:
    id: ${output.myWorkRowIdRe}
- extendedWaitUntil:
    visible:
      id: 'drafting-tab-bar'
    timeout: 30000
- assertVisible:
    id: 'drafting-tab-bible'
- assertVisible:
    id: 'drafting-tab-resources'
- assertVisible:
    id: 'drafting-tab-record'
- tapOn:
    id: 'drafting-header-back'
- extendedWaitUntil:
    visible:
      id: 'home-tab-my-work'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
