# Next Home -> fixture chapter -> Passage -> back, existing session.
# Requires: logged-in app, Home reachable, and the fixture chapter on the
# milestone book. Next up only renders a few drafting passages, so an earlier
# book can fill that rail and hide the fixture. Tap the Next up tile when it
# is on screen; otherwise open the milestone book.
# MAESTRO_FIXTURE_CHAPTER_ID and MAESTRO_FIXTURE_MILESTONE_ID: digits
# /^[1-9][0-9]*$/. Copy the chapter id onto output first (Graal YAML ${ENV}
# becomes the literal "undefined" when the key is missing).
# No login or clearState.
appId: com.eten.fluent
tags:
  - nav
  - existing-session
  - ordered-readonly
---
- evalScript: >-
    ${output.fixtureChapterId = (typeof MAESTRO_FIXTURE_CHAPTER_ID === 'undefined' || MAESTRO_FIXTURE_CHAPTER_ID === null) ? '' : String(MAESTRO_FIXTURE_CHAPTER_ID).trim()}
- assertTrue: ${typeof output.fixtureChapterId === 'string' && /^[1-9][0-9]*$/.test(output.fixtureChapterId)}
- assertTrue: ${RegExp('^home-next-' + output.fixtureChapterId + ':.*').test('home-next-' + output.fixtureChapterId + ':x') === true}
- assertTrue: ${RegExp('^home-next-' + output.fixtureChapterId + ':.*').test('home-next-' + output.fixtureChapterId + '0:x') === false}
- assertNotVisible:
    id: 'login-email-input'
- runFlow: ../../shared/nav/goto-home.yaml
- assertVisible:
    id: 'home-header'
# Bring Next up on screen, then take the fixture tile only if this account's
# rail actually rendered it.
- scrollUntilVisible:
    element:
      id: 'home-next-up'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- runFlow:
    when:
      visible:
        id: '^home-next-${output.fixtureChapterId}:.*'
    commands:
      - runFlow: ../../shared/ensure/ensure-no-modal.yaml
      - tapOn:
          id: '^home-next-${output.fixtureChapterId}:.*'
# Books sit above Next up. Scroll up before the book helper, which only
# searches downward.
- runFlow:
    when:
      notVisible:
        id: 'passage-header|observer-screen'
    commands:
      - scrollUntilVisible:
          element:
            id: '^home-book-${MAESTRO_FIXTURE_MILESTONE_ID}:.*'
          direction: UP
          timeout: 20000
          visibilityPercentage: 50
          optional: true
      - runFlow: ../../shared/nav/open-fixture-chapter-from-milestone.yaml
- extendedWaitUntil:
    visible:
      id: 'passage-header'
    timeout: 30000
- assertVisible:
    id: 'passage-record|passage-listen'
- tapOn:
    id: 'passage-back'
# Next up returns straight to Home. The book path stops on the book page.
- extendedWaitUntil:
    visible:
      id: 'home-header|book-header'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'book-back'
    commands:
      - tapOn:
          id: 'book-back'
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 30000
- assertNotVisible:
    id: 'login-email-input'
