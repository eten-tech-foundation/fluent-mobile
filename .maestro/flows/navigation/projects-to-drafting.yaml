# Next Home Books → book page → passage cover → Passage.
appId: com.eten.fluent
tags:
  - smoke
  - nav
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- scrollUntilVisible:
    element:
      id: 'home-book-.*'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'home-book-.*'
- extendedWaitUntil:
    visible:
      id: 'book-header'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'book-passage-.*'
    timeout: 60000
- tapOn:
    id: 'book-passage-.*'
- extendedWaitUntil:
    visible:
      id: 'passage-header'
    timeout: 60000
- assertVisible:
    id: 'passage-record|passage-listen|observer-screen'
