# Home Milestones tab → milestone → chapter → drafting.
appId: com.eten.fluent
tags:
  - smoke
  - nav
---
- runFlow: ../../shared/ensure/ensure-warm-home.yaml
- tapOn:
    id: 'home-tab-projects'
- extendedWaitUntil:
    visible:
      id: 'milestone-row-.*'
    timeout: 60000
- tapOn:
    id: 'milestone-row-.*'
- extendedWaitUntil:
    visible:
      id: 'chapter-row-.*'
    timeout: 60000
- tapOn:
    id: 'chapter-row-.*'
- extendedWaitUntil:
    visible:
      id: 'drafting-tab-bar'
    timeout: 60000
- assertVisible:
    id: 'drafting-tab-bible'
- assertVisible:
    id: 'drafting-tab-resources'
- assertVisible:
    id: 'drafting-tab-record'
