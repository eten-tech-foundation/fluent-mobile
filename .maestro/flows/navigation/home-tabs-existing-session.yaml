# Next Home Books ↔ Next up roundtrip on an already signed-in session.
# Requires: logged-in app on Home with at least one book and Next up.
# No login, clearState, or warm-session helpers.
appId: com.eten.fluent
tags:
  - nav
  - existing-session
  - ordered-readonly
---
- assertNotVisible:
    id: 'login-email-input'
- assertVisible:
    id: 'home-header'
- assertVisible:
    id: 'home-scroll'

- scrollUntilVisible:
    element:
      id: 'home-books'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'home-book-.*'
- assertNotVisible:
    id: 'login-email-input'

- scrollUntilVisible:
    element:
      id: 'home-next-up'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'home-next-up'
- assertVisible:
    id: 'home-header'
- assertNotVisible:
    id: 'login-email-input'

- scrollUntilVisible:
    element:
      id: 'home-books'
    direction: UP
    timeout: 60000
- assertVisible:
    id: 'home-book-.*'
- assertNotVisible:
    id: 'login-email-input'
