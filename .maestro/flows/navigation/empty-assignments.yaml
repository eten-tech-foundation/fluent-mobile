# Account B (member-without-assignments): books from membership, nothing to record.
# Uses MAESTRO_EMAIL_2 / MAESTRO_PASSWORD_2. Not tagged `smoke` (needs second pair).
appId: com.eten.fluent
tags:
  - accounts
  - empty-assignments
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-account-b.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml

# Membership still surfaces books on Home.
- scrollUntilVisible:
    element:
      id: 'home-books'
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: 'home-book-.*'

# Nothing assigned to record in Next up. Do not assertNotVisible
# `home-next-.*` — that regex also matches `home-next-up-empty`.
- scrollUntilVisible:
    element:
      id: 'home-next-up'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'home-next-up-empty'
- assertNotVisible:
    id: 'home-next-up-hero'
