# Next Home: Books and Next up on the same scroll (no My Work / Projects tabs).
appId: com.eten.fluent
tags:
  - smoke
  - nav
---
- runFlow: ../../shared/ensure/ensure-on-login.yaml
- runFlow: ../../shared/auth/login-translator.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 180000
- runFlow: ../../shared/ensure/ensure-no-modal.yaml
- scrollUntilVisible:
    element:
      id: 'home-books'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'home-book-.*'
- scrollUntilVisible:
    element:
      id: 'home-next-up'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'home-next-up'
- scrollUntilVisible:
    element:
      id: 'home-books'
    direction: UP
    timeout: 60000
- assertVisible:
    id: 'home-books'
